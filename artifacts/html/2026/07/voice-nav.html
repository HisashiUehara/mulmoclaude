<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MulmoNavi</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e7ecf3; --muted:#93a0b4; --accent:#4c8dff; --accent2:#2ee6a6;
    --warn:#ffb020; --danger:#ff5470; --radius:16px;
    --sheet-h: 46vh;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* Top bar */
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;
    background:linear-gradient(180deg,rgba(15,17,21,.96),rgba(15,17,21,.75));
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:20}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
  header .spacer{flex:1}
  .pill{border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .pill:active{transform:scale(.96)}
  .pill.on{border-color:var(--accent);color:#fff;background:rgba(76,141,255,.18)}

  /* Map */
  #mapWrap{position:relative;flex:1;min-height:0}
  #map{position:absolute;inset:0}
  #recenter{position:absolute;right:14px;bottom:16px;z-index:10;width:46px;height:46px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);color:var(--txt);display:grid;place-items:center;font-size:20px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.4)}

  /* Instruction banner (during nav) */
  #banner{position:absolute;left:12px;right:12px;top:12px;z-index:12;display:none;
    background:linear-gradient(135deg,#1b3a68,#12233f);border:1px solid #2b4c86;border-radius:14px;
    padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #banner.show{display:flex;align-items:center;gap:12px}
  #banner .man{width:46px;height:46px;flex:0 0 auto;border-radius:12px;background:#0e1b31;display:grid;place-items:center;font-size:24px}
  #banner .b-main{font-size:17px;font-weight:700;line-height:1.25}
  #banner .b-sub{font-size:12px;color:#a9c2ec;margin-top:2px}
  #banner .b-dist{margin-left:auto;text-align:right}
  #banner .b-dist b{font-size:20px}

  /* Bottom sheet */
  #sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;max-height:var(--sheet-h);z-index:15;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
  .grab{width:44px;height:5px;border-radius:3px;background:#333a48;margin:8px auto 4px}
  #originBar{display:flex;align-items:center;gap:6px;padding:2px 14px 6px;font-size:12.5px;color:var(--muted)}
  #originBar .ob-ic{font-size:13px}
  #originBar b{color:var(--txt);font-weight:600}
  #compareBar{margin:0 12px 8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
  #compareBar .cmp-row{display:grid;grid-template-columns:52px 1fr 1fr 1fr 1fr;align-items:center;
    padding:7px 10px;font-size:12.5px;color:var(--txt);border-top:1px solid var(--line)}
  #compareBar .cmp-head{display:grid;grid-template-columns:52px 1fr 1fr 1fr 1fr;padding:5px 10px;
    font-size:11px;color:var(--muted);background:#151922}
  #compareBar .cmp-row.on{background:rgba(76,141,255,.14)}
  #compareBar .cmp-l{font-weight:700;color:#a9c2ec}
  #compareBar .cmp-row.on .cmp-l{color:var(--accent2)}
  #compareBar .cmp-t{font-weight:700}
  #compareBar .cmp-fee{color:var(--muted)}
  #compareBar .cmp-head span,#compareBar .cmp-row span{text-align:right}
  #compareBar .cmp-head span:first-child,#compareBar .cmp-row span:first-child{text-align:left}
  #hwySeg{margin:0 12px 8px;font-size:12px;color:var(--muted);padding:2px 4px;line-height:1.4}
  #hwySeg b{color:#a9c2ec;font-weight:600}
  .log{flex:1;overflow-y:auto;padding:6px 14px 4px;display:flex;flex-direction:column;gap:8px;min-height:80px}
  .msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;padding:2px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:6px 14px 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);color:var(--muted);
    border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip:active{background:var(--accent);color:#fff}

  /* Input row */
  .inputRow{display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line)}
  #text{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:999px;padding:12px 14px;font-size:15px;outline:none}
  #text:focus{border-color:var(--accent)}
  .icbtn{width:46px;height:46px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);display:grid;place-items:center;font-size:19px;cursor:pointer}
  .icbtn:active{transform:scale(.94)}
  #mic{background:var(--accent);border-color:var(--accent);color:#fff}
  #mic.listening{background:var(--danger);border-color:var(--danger);animation:pulse 1.1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,84,112,.5)}70%{box-shadow:0 0 0 14px rgba(255,84,112,0)}100%{box-shadow:0 0 0 0 rgba(255,84,112,0)}}
  #send{background:var(--accent2);border-color:var(--accent2);color:#04231a;font-weight:800}

  /* Steps drawer */
  #steps{display:none;flex-direction:column;gap:2px;padding:4px 12px 8px;max-height:160px;overflow-y:auto;border-top:1px dashed var(--line)}
  #steps.show{display:flex}
  .step{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;border-radius:10px;font-size:13px}
  .step.active{background:rgba(76,141,255,.14)}
  .step .mi{font-size:16px;width:22px;text-align:center;flex:0 0 auto}
  .step .d{color:var(--muted);font-size:11.5px}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50;padding:20px}
  .modal.show{display:grid}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:420px;width:100%}
  .card h3{margin:0 0 6px}
  .card p{color:var(--muted);font-size:13px;margin:6px 0 12px;line-height:1.5}
  .card input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:11px;font-size:14px;margin-bottom:12px}
  .card .row{display:flex;gap:8px;justify-content:flex-end}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .setLbl{display:block;font-size:12.5px;color:var(--muted);margin:2px 0 6px}
  .voiceRow{display:flex;gap:8px;margin-bottom:14px}
  .voiceRow select{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:11px;font-size:14px;outline:none}
  .voiceRow select:focus{border-color:var(--accent)}
  .voiceRow .btn{flex:0 0 auto}
  .tog{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--txt);margin:0 0 10px;cursor:pointer}
  .tog input{width:20px;height:20px;accent-color:var(--accent2);flex:0 0 auto}
  .msg .eng{display:inline-block;margin-left:7px;font-size:9px;line-height:1;padding:1px 5px;border-radius:6px;
    vertical-align:middle;opacity:.85;border:1px solid transparent}
  .msg .eng[data-kind="openai"]{color:#04231a;background:var(--accent2)}
  .msg .eng[data-kind="cache"]{color:#04231a;background:var(--accent2);opacity:.7}
  .msg .eng[data-kind="web"]{color:var(--muted);border-color:var(--line);background:transparent}
  #tokenNotice{position:fixed;left:0;right:0;top:0;z-index:80;display:flex;align-items:center;gap:10px;
    padding:10px 14px calc(10px + env(safe-area-inset-top));background:#3a2a12;border-bottom:1px solid #6b4e1e;
    color:#ffe6b0;font-size:12.5px;line-height:1.4}
  #tokenNotice a{color:#ffd27a;font-weight:700;text-decoration:underline;white-space:nowrap}
  #tokenNotice button{margin-left:auto;flex:0 0 auto;background:transparent;border:0;color:#ffe6b0;font-size:18px;line-height:1;cursor:pointer}

  #toast{position:fixed;left:50%;bottom:calc(var(--sheet-h) + 20px);transform:translateX(-50%);
    background:#000;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot"></span><span data-i18n="title">MulmoNavi</span></div>
    <div class="spacer"></div>
    <button class="pill" id="langBtn">🌐 <span id="langLbl">日本語</span></button>
    <button class="pill" id="ttsBtn" title="読み上げ">🔊</button>
    <button class="pill" id="setBtn">⚙️</button>
  </header>

  <div id="mapWrap">
    <div id="map"></div>
    <button id="recenter" title="現在地">◎</button>
    <div id="banner">
      <div class="man" id="bMan">↑</div>
      <div>
        <div class="b-main" id="bMain">—</div>
        <div class="b-sub" id="bSub"></div>
      </div>
      <div class="b-dist"><b id="bDist">—</b><div class="b-sub" id="bEta"></div></div>
    </div>
  </div>

  <div id="sheet">
    <div class="grab"></div>
    <div id="originBar" title="出発地"><span class="ob-ic">🚩</span><span id="originText">現在地</span></div>
    <div id="compareBar" style="display:none"></div>
    <div id="hwySeg" style="display:none"></div>
    <div class="log" id="log"></div>
    <div class="chips" id="chips"></div>
    <div id="steps"></div>
    <div class="inputRow">
      <button class="icbtn" id="mic" title="音声入力">🎤</button>
      <input id="text" autocomplete="off" />
      <button class="icbtn" id="send">➤</button>
    </div>
  </div>
</div>

<div class="modal" id="setModal">
  <div class="card">
    <h3 data-i18n="setTitle">設定 / Google Maps APIキー</h3>
    <p data-i18n="setDesc">キーはこの端末のブラウザにのみ保存されます。HTTPリファラー制限をかけて利用してください。</p>
    <input id="keyInput" placeholder="AIzaSy..." />

    <label class="setLbl" data-i18n="openaiTtsLbl">OpenAIの自然な声</label>
    <label class="tog"><input type="checkbox" id="openaiTtsToggle"> <span data-i18n="openaiTtsUse">OpenAI TTSを使う（未設定時は自動で内蔵音声）</span></label>
    <div class="voiceRow">
      <select id="ttsModelSelect" title="TTSモデル"></select>
    </div>
    <div class="voiceRow">
      <select id="openaiVoiceSelect" title="ボイス（現在の言語用）"></select>
      <button class="btn" id="openaiVoiceTest" data-i18n="voiceTest">試聴</button>
    </div>
    <div class="voiceRow"><button class="btn" id="auditionBtn" style="flex:1" data-i18n="audition">全ボイス聴き比べ</button></div>

    <p class="setLbl" data-i18n="fallbackNote">OpenAI未接続・キー未設定時は、自動でブラウザ内蔵音声に切り替わります（案内は途切れません）。内蔵音声の声は選べません。</p>

    <div class="row">
      <button class="btn" id="setCancel" data-i18n="cancel">キャンセル</button>
      <button class="btn primary" id="setSave" data-i18n="save">保存して再読込</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================ 設定・状態 ============================ */
const DEFAULT_KEY = "AIzaSyCOOHJWjyBtoiQFW-DmOD0SnaAcskSf7_g";
const KEY = localStorage.getItem("gmaps_key") || DEFAULT_KEY;

const S = {
  lang: localStorage.getItem("nav_lang") || "ja",   // ja | en
  tts: localStorage.getItem("nav_tts") !== "0",
  map:null, dirService:null, dirRenderer:null, places:null, geocoder:null,
  me:null, meMarker:null, meAccuracy:null,
  origin:null, destination:null, destName:"", waypoints:[],
  route:null, steps:[], curStep:0, navOn:false, watchId:null, lastSpokenStep:-1,
  travelMode:"DRIVING",
  avoidTolls:false, avoidHighways:false,  // 有料道路/高速を避けるか
  // ── RouteIntent DSL 状態 ──
  routeIntent:{ origin:"current", destination:null, via:[], prefer:{avoidHighways:false, avoidTolls:false} },
  originOverride:null,  // 明示出発地の解決済み latlng（null = 現在地"current"）
  originName:null,      // 出発地の表示名（null = 現在地）
  intentSeq:0,          // applyRouteIntent の後勝ち世代ガード
  pendingRoad:false,  // 高速を使うか確認待ち
  pending:null,   // 目的地確認中の候補 { cands, idx, markers, timer }
  navChatToken:null, navChatUrl:null,  // 第2層(LLM会話)のview-token + エンドポイント
  ttsToken:null, ttsUrl:null,          // OpenAI TTS(/api/tts)のview-token + エンドポイント
  openaiTts: localStorage.getItem("nav_openai_tts") !== "0",  // 既定ON（キー未設定時は自動でWeb Speechへ）
  // モデルとボイスは言語別に保持。gpt-4o-mini-tts は instructions で日本語ネイティブ発音を
  // 指定できるため既定。日本語=nova / 英語=shimmer を初期値に（⚙️で変更・言語で自動切替）。
  ttsModel: localStorage.getItem("nav_tts_model") || "gpt-4o-mini-tts",
  openaiVoiceJa: localStorage.getItem("nav_openai_voice_ja") || "nova",
  openaiVoiceEn: localStorage.getItem("nav_openai_voice_en") || "shimmer",
  curAudio:null,                       // 再生中のOpenAI音声（割り込み停止用）
  townName:"", townAt:0,               // 現在地の町名キャッシュ(逆ジオコード)
  history:[]                           // 直近の会話ログ {role,text}（context用）
};
const CONFIRM_TIMEOUT_MS = 30000;   // 無応答で確認を破棄
const MAX_CANDIDATES = 3;
const NAV_CHAT_TIMEOUT_MS = 12000;      // LLM応答のタイムアウト→定型文フォールバック

// 起動時、launcherが URL フラグメントで渡したトークン(mcnav=nav-chat, mcvt=tts)を
// 取り込む。フラグメントはサーバーに送られず Referer からも除かれる。取得後は
// 即座にアドレスバーから除去。取れなければ各機能は無効（定型文/Web Speechへ）。
(function readViewTokens(){
  try{
    const h = location.hash || "";
    if(h.length > 1){
      const p = new URLSearchParams(h.slice(1));
      const sameOrigin = location.origin && location.origin !== "null";
      const nav = p.get("mcnav");
      if(nav && sameOrigin){
        S.navChatToken = nav;
        S.navChatUrl = new URL("/api/nav-chat", location.origin).href;
      }
      const vt = p.get("mcvt");
      if(vt && sameOrigin){
        S.ttsToken = vt;
        S.ttsUrl = new URL("/api/tts", location.origin).href;
      }
      history.replaceState(null, "", location.pathname + location.search);
    }
  }catch(e){ /* フラグメント無し／file:// 等 → OpenAI連携は無効 */ }
})();

// 恒久対策: ランチャー経由でなくても、アプリ自身が同一オリジンで tts / nav-chat
// トークンを取得する。/api/nav-view-tokens は same-origin(ループバック)ガードのみで
// bearer不要。これで「トークン未受領で会話にならない/内蔵音声に落ちる」を根絶する。
(async function provisionTokens(){
  try{
    if(!location.origin || location.origin==="null") return;
    if(S.ttsToken && S.navChatToken) return;   // フラグメントで取得済みなら不要
    const res = await fetch(new URL("/api/nav-view-tokens", location.origin).href, {
      method:"POST", headers:{ "Content-Type":"application/json" }, body:"{}"
    });
    if(!res.ok) return;
    const d = await res.json();
    if(d && d.ttsToken){ S.ttsToken=d.ttsToken; S.ttsUrl=new URL("/api/tts", location.origin).href; }
    if(d && d.navChatToken){ S.navChatToken=d.navChatToken; S.navChatUrl=new URL("/api/nav-chat", location.origin).href; }
    // 取得できたら「トークン未受領」バナーがあれば消す
    if(S.ttsToken){ const bar=document.getElementById("tokenNotice"); if(bar) bar.remove(); }
    console.log("[MulmoNavi] self-provisioned tokens:", { tts:!!S.ttsToken, navChat:!!S.navChatToken });
  }catch(e){ /* 取得失敗 → 従来どおりフォールバック */ }
})();

/* ============================ i18n ============================ */
const I18N = {
  ja:{
    title:"MulmoNavi", langLbl:"日本語",
    setTitle:"設定 / Google Maps APIキー",
    setDesc:"キーはこの端末のブラウザにのみ保存されます。HTTPリファラー制限をかけて利用してください。",
    cancel:"キャンセル", save:"保存して再読込",
    hello:"こんにちは！行き先を話しかけるか入力してください。",
    chips:["東京駅へ","近くのコンビニ","ガソリンスタンド","ナビ開始","次どっち？","案内やめて"],
    listen:"聞いています…", noSpeech:"聞き取れませんでした。もう一度どうぞ。",
    micDenied:"マイクの使用が許可されていません。", locating:"現在地を取得中…",
    locDenied:"位置情報が使えません。手動で出発地を指定してください。",
    searching:q=>`「${q}」を検索中…`,
    notFound:q=>`「${q}」が見つかりませんでした。`,
    destSet:n=>`目的地を「${n}」に設定しました。`,
    askToll:"高速道路を使いますか？",
    tollUse:"高速道路を使ってルートを引きます。",
    tollAvoid:"高速道路・有料道路を使わずにルートを引きます。",
    reroutedUse:"高速を使うルートに引き直しました。",
    reroutedAvoid:"下道でルートを引き直しました。",
    statusNoRoute:"まだルートがありません。行き先を教えてください。",
    statusLine:(km,min,mode)=>`残り約${km}キロ、到着まで約${min}分。${mode}で移動中です。`,
    muted:"🔇 消音しました。",
    remembered:"覚えておきますね。",
    recallStub:"その記録はまだ準備中です。",
    routeReady:(d,t)=>`ルートを引きました：${d}・約${t}。「ナビ開始」と言ってください。`,
    noRoute:"ルートが見つかりませんでした。",
    needDest:"先に目的地を指定してください。",
    navStart:"ナビを開始します。安全運転で！",
    navStop:"ナビを終了しました。",
    detourAdd:n=>`「${n}」を経由地に追加してルートを引き直しました。`,
    detourNone:c=>`近くに${c}が見つかりませんでした。`,
    arrive:"まもなく目的地に到着します。おつかれさまでした！",
    reroute:"ルートを外れました。引き直します…",
    inMeters:(m,man)=>`${m}メートル先、${man}`,
    thenMeters:man=>`この先、${man}`,
    now:man=>`まもなく${man}`,
    arriveDest:"目的地です",
    help:"できること：目的地を言う／「近くの〇〇」で寄り道／「ナビ開始」「次どっち」「案内やめて」",
    modeSet:m=>`移動手段を${m}にしました。`, walk:"徒歩", drive:"車",
    curStep:(m,man)=>`次は ${m}先、${man}`,
    voiceTest:"試聴",
    fallbackNote:"OpenAI未接続・キー未設定時は、自動でブラウザ内蔵音声に切り替わります（案内は途切れません）。内蔵音声の声は選べません。",
    openaiTtsLbl:"OpenAIの自然な声", openaiTtsUse:"OpenAI TTSを使う（未設定時は自動で内蔵音声）", audition:"全ボイス聴き比べ",
    voiceSample:"MulmoNaviです。次の交差点を右に曲がってください。",

/* ============================ ユーティリティ ============================ */
const $ = id=>document.getElementById(id);
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
function stripHtml(h){const d=document.createElement("div");d.innerHTML=h;return d.textContent||"";}
function fmtDist(m){return m>=1000?(m/1000).toFixed(m<10000?1:0)+" km":Math.round(m/10)*10+" m";}

function addMsg(text, who="bot"){
  const el=document.createElement("div");
  el.className="msg "+who; el.textContent=text;
  $("log").appendChild(el); $("log").scrollTop=$("log").scrollHeight;
  // 会話履歴（sysは除外）。context用に直近だけ保持。
  if(who==="user"||who==="bot"){
    S.history.push({role:who, text});
    if(S.history.length>8) S.history.splice(0, S.history.length-8);
  }
  return el;
}
function botSay(text, speak=true, opts){ const el=addMsg(text,"bot"); if(speak) tts(text, Object.assign({el}, opts)); }

/* ============================ 音声合成 (TTS) ============================ */
// 音声エンジンは OpenAI TTS 一本。内蔵音声(Web Speech)は「OpenAI不達・キー未設定
// 時の自動フォールバック」専用で、ブラウザ既定の声をそのまま使う（ユーザーが声を
// 選ぶ機能は廃止）。フォールバック中は画面のエンジンバッジが「内蔵」を表示する。
// 読み上げ用に括弧内の補足を除去（音声が「（…）」まで喋って冗長になるのを防ぐ）
function stripParens(s){
  return String(s)
    .replace(/[（(][^（()）]*[）)]/g, "")  // 全角・半角の括弧と中身を削除
    .replace(/\s{2,}/g, " ")
    .trim();
}
// 現在再生中（Web Speech / OpenAI音声）を「完了」させるresolver。割り込みや
// キュー直列化のために、再生終了・エラー・stopSpeaking のいずれでも解放する。
let _curRelease=null;

// バージイン調整（「止まりやすい」側に倒す。エコー誤爆はログを見て後調整）:
//  ECHO_TAIL_MS = 発話終了後にエコー残響を無視するデッドウィンドウ（短いほど割り込みやすい）
const ECHO_TAIL_MS = 350;
// ブラウザ内蔵音声（Web Speech）。awaitで発話終了まで待てる（キュー直列化のため）。
function webSpeak(text){
  return new Promise((resolve)=>{
    if(!S.tts || !window.speechSynthesis){ resolve(); return; }
    let settled=false;
    const done=()=>{ if(settled)return; settled=true; speaking=false; ignoreUntil=Date.now()+ECHO_TAIL_MS; if(_curRelease===done)_curRelease=null; resolve(); };
    try{
      const u=new SpeechSynthesisUtterance(stripParens(text));
      // ブラウザ既定の声を使う（ボイス選択UIは廃止）。言語だけ指定して、あとは
      // OSに任せる。これで「内蔵音声を選び込む」コードは不要になった。
      u.lang = S.lang==="ja" ? "ja-JP" : "en-US";
      u.rate=0.98; u.pitch=1.02; u.volume=1;
      u.onstart=()=>{ speaking=true; S._barged=false; };
      u.onend=done; u.onerror=done;
      _curRelease=done;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){ done(); }
  });
}

// 進行中の発話を止める。保留中の再生promiseも解放してキューを次へ進める。
function stopSpeaking(){
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  if(S.curAudio){ try{ S.curAudio.pause(); }catch(e){} S.curAudio=null; }
  if(_curRelease){ const r=_curRelease; _curRelease=null; r(); }
}

/* ---- IndexedDB: ナビ定型文のOpenAI音声をキャッシュ（走行中ゼロ遅延） ---- */
let ttsDbPromise=null;
function ttsDb(){
  if(ttsDbPromise) return ttsDbPromise;
  ttsDbPromise=new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.open("mulmonavi-tts",1);
      req.onupgradeneeded=()=>{ req.result.createObjectStore("clips"); };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    }catch(e){ reject(e); }
  });
  return ttsDbPromise;
}
function idbGet(key){
  return ttsDb().then(db=>new Promise((resolve,reject)=>{
    const r=db.transaction("clips","readonly").objectStore("clips").get(key);
    r.onsuccess=()=>resolve(r.result||null); r.onerror=()=>reject(r.error);
  })).catch(()=>null);
}
function idbPut(key,blob){
  return ttsDb().then(db=>new Promise((resolve,reject)=>{
    const r=db.transaction("clips","readwrite").objectStore("clips").put(blob,key);
    r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error);
  })).catch(()=>{});
}

// 現在言語のOpenAIボイス（言語別に保持し、🌐で自動切替）
function curVoice(){ return (S.lang==="ja" ? S.openaiVoiceJa : S.openaiVoiceEn) || (S.lang==="ja"?"nova":"shimmer"); }
// gpt-4o-mini-tts 用の言語指示（tts-1/hdは非対応なので空を返す）。日本語の英語訛りを抑える。
function ttsInstructions(){
  if(S.ttsModel!=="gpt-4o-mini-tts") return "";
  return S.lang==="ja"
    ? "日本語ネイティブのアナウンサーのように、落ち着いて明瞭に、自然なイントネーションで読み上げてください。英語訛りにしないこと。"
    : "Speak clearly and naturally, like a native English car-navigation voice.";
}
// OpenAI TTS(/api/tts)へプロキシ経由でリクエスト → mp3 Blob
async function fetchTts(text, voice, model, instructions){
  const body={ text: stripParens(text), voice, model:model||S.ttsModel, format:"mp3" };
  if(instructions) body.instructions=instructions;   // gpt-4o-mini-tts のみサーバーが転送
  const res=await fetch(S.ttsUrl,{ method:"POST",
    headers:{ "Authorization":"Bearer "+S.ttsToken, "Content-Type":"application/json" },
    body: JSON.stringify(body) });
  if(!res.ok) throw new Error("tts http "+res.status);   // 503(キー未設定)含め、Web Speechへ落とす
  return await res.blob();
}
/* ---- モバイル音声アンロック ----
   iOS/Android は「ユーザー操作を起点にした再生」でないと音を出せない。ナビ案内は
   位置情報コールバック起点で鳴るため、最初のタップで一度だけ無音を再生して
   Audio要素と Web Speech を解錠しておく（以後は自動再生できる）。単一の Audio 要素を
   使い回すのが最も確実（新規要素は都度ロックされ得るため）。 */
let audioUnlocked=false;
const SILENT_WAV="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=";
function ensureAudioEl(){
  if(!S.audioEl){
    const a=new Audio();
    a.preload="auto";
    a.setAttribute("playsinline","");   // iOSでインライン再生（全画面化させない）
    S.audioEl=a;
  }
  return S.audioEl;
}
function unlockAudioOnce(){
  if(audioUnlocked) return; audioUnlocked=true;
  try{ const a=ensureAudioEl(); a.src=SILENT_WAV; const p=a.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
  // フォールバック(Web Speech)も空発話で解錠しておく
  try{ if(window.speechSynthesis){ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
}
["pointerdown","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev, unlockAudioOnce, {once:true, passive:true}));

// Blobを再生。再生「終了」で解決（キュー直列化のため）。onStartは再生開始時に呼ぶ
// （play-start計測用）。stopSpeaking/割り込み時も _curRelease 経由で完了扱いにする。
function playBlob(blob, onStart){
  return new Promise((resolve,reject)=>{
    // モバイル(iOS/Android)は都度 new Audio() だと毎回ユーザー操作を要求するため、
    // 一度アンロックした単一要素(ensureAudioEl)を使い回して src だけ差し替える。
    const a=ensureAudioEl();
    const url=URL.createObjectURL(blob);
    a.src=url;
    S.curAudio=a; speaking=true; S._barged=false;
    let settled=false, started=false;
    const end=(ok)=>{
      if(settled) return; settled=true;
      speaking=false; ignoreUntil=Date.now()+ECHO_TAIL_MS;
      if(S.curAudio===a){ S.curAudio=null; }
      if(_curRelease===doRelease) _curRelease=null;
      try{ URL.revokeObjectURL(url); }catch(e){}
      ok ? resolve() : reject(new Error("audio play failed"));
    };
    const doRelease=()=>end(true);   // stopSpeaking/割り込み → 正常完了扱い（フォールバックしない）
    _curRelease=doRelease;
    a.onplaying=()=>{ if(!started){ started=true; if(onStart) onStart(); } };
    a.onended=()=>end(true);
    a.onerror=()=>end(false);
    a.play().catch(()=>end(false));
  });
}

/* ---- 読み上げ用の表記正規化（問題4: TTSの読み間違い対策） ----
   全発話が通る共通経路(tts)で1回だけ適用。文言を作る場所ごとの対応漏れを防ぐ。
   ・時刻 21:34 / 07:05 → 「21時34分」「7時5分」（ゼロ埋め解除、分00は「N時」）
   ・距離 9.2 km / 230 m → 「9.2キロ」「230メートル」（ja のみ、単位を仮名化）
   画面表示(バブル/比較パネル)は元の表記のまま。ここは音声に渡す文字列だけ変換する。*/
function normalizeForSpeech(text){
  let s = text==null ? "" : String(text);
  if(S.lang!=="ja") return s;   // en は "21:34" 等をブラウザTTSが自然に読むため変換しない
  s = s.replace(/(\d{1,2}):(\d{2})(?!\d)/g, (m,h,mi)=>{
    const H=parseInt(h,10), M=parseInt(mi,10);
    if(H>23||M>59) return m;                 // 時刻でなければそのまま
    return M===0 ? `${H}時` : `${H}時${M}分`;
  });
  s = s.replace(/(\d+(?:\.\d+)?)\s*km\b/gi, "$1キロ");
  s = s.replace(/(\d+)\s*m\b/gi, "$1メートル");
  return s;
}

/* ---- 読み上げキュー（直列化）: 発話が重ならないよう1つずつ順に再生する ---- */
let _ttsQueue=[], _ttsBusy=false;
// 読み上げ入口。実際の再生は pumpTts が1件ずつ直列に処理する。
// ※ ここで normalizeForSpeech を掛けるのが唯一の共通経路（OpenAI/内蔵の両TTS・IDBキャッシュ鍵も正規化後）。
function tts(text, opts){ _ttsQueue.push([normalizeForSpeech(text), opts]); pumpTts(); }
async function pumpTts(){
  if(_ttsBusy) return;
  _ttsBusy=true;
  while(_ttsQueue.length){
    const [text, opts]=_ttsQueue.shift();
    try{ await speakOne(text, opts); }catch(e){}
  }
  _ttsBusy=false;
}
// 新しいユーザー発話が来たら、進行中の読み上げを止めてキューを空にする（割り込み）。
// ストリーミング中のnav-chatも中断（第2文以降の生成・再生を止める）。
function flushTts(){ _ttsQueue.length=0; stopSpeaking(); try{ if(S.navAbort) S.navAbort.abort(); }catch(e){} }

// 1件を最後まで読み上げる（3段構え）。OpenAI TTS(ON+トークン有)→[定型文はIDBキャッシュ]
// →失敗/未設定はWeb Speechへ自動フォールバック（ナビは絶対に止めない）。
// opts.cache=false で会話応答をキャッシュ対象外に。opts.sinceRecv で合計遅延計測。
// 発話終了後この時間内は、直近bot発話に一致する認識結果をエコーとして破棄する。
// （barge-in の「止まりやすさ」は interim 側の isEchoLight で維持しつつ、確認プロンプト等の
//   TTSエコーが final としてコマンド化され確認ループを生むのを防ぐ）。
const ECHO_GUARD_MS = 3500;
async function speakOne(text, opts){
  if(!S.tts) return;
  S._botText = text;   // バージイン用: 今読み上げている文（自分のエコー判定に使う）
  // エコー修正(2): 「発話予定の全文」を再生開始時点で _echoBuf に投入する。こうすると
  // interimバージインで途中STOPされ botText がクリアされても、続きの final を isLateEcho で
  // 弾ける（STOPの有無に依存しないエコー判定）。終了/STOP時に at を更新して窓を延長する。
  if(!S._echoBuf) S._echoBuf=[];
  const echoEntry = { text, at: Date.now() };
  S._echoBuf.push(echoEntry);
  if(S._echoBuf.length>5) S._echoBuf.shift();
  try{
    await speakOneInner(text, opts);
  } finally {
    S._botText = "";
    echoEntry.at = Date.now();   // 発話終了/STOP時点に窓をリフレッシュ（以後 ECHO_GUARD_MS 有効）
  }
}
async function speakOneInner(text, opts){
  const el = opts && opts.el;
  const useOpenAI = S.openaiTts && S.ttsToken && S.ttsUrl;
  if(!useOpenAI){
    const why = !S.openaiTts ? "OpenAI TTS が OFF（⚙️でON）"
              : !S.ttsToken ? "音声トークン未受領：ランチャー『MulmoNavi を起動』から開いてください"
              : "TTSエンドポイント未設定";
    markEngine(el,"web",why); noteEngine("web",why); await webSpeak(text); return;
  }
  const cache = !opts || opts.cache !== false;
  const voice = curVoice();
  const model = S.ttsModel;
  const t0 = performance.now();
  try{
    // キーに lang/model/voice を含める → モデル・ボイス・言語を切り替えても旧音声は混入しない
    const key = S.lang+"|"+model+"|"+voice+"|"+text;
    let blob = cache ? await idbGet(key) : null;
    const hit = !!blob;
    if(!blob){ blob = await fetchTts(text, voice, model, ttsInstructions()); if(cache) idbPut(key, blob); }
    await playBlob(blob, ()=>{   // 再生開始時: バッジ更新＋遅延ログ
      markEngine(el, hit?"cache":"openai"); noteEngine("openai");
      const gen = Math.round(performance.now()-t0);
      const total = (opts && opts.sinceRecv!=null) ? " total(recv→play)="+Math.round(performance.now()-opts.sinceRecv)+"ms" : "";
      console.log(`[MulmoNavi TTS] ${hit?"cache-hit":"openai"} (${model}/${voice}) play-start=${gen}ms${total} "${String(text).slice(0,24)}"`);
    });
  }catch(e){
    const why = "OpenAI TTS 失敗（"+((e&&e.message)||e)+"）→ 内蔵音声";
    console.log("[MulmoNavi TTS] fallback→WebSpeech:", (e&&e.message)||e);
    markEngine(el,"web",why); noteEngine("web",why);
    await webSpeak(text);   // 不達・503・再生失敗 → 内蔵音声で継続
  }
}
// 認識結果が「自分のTTSのエコー」か判定（final=コマンド化を守るための厳しめ判定）。
// 「止まりやすい」側に倒す方針:
//  - 短い発話(<4字)はコマンドの可能性が高いのでエコー扱いしない（例:「止めて」「右」）
//  - 文字重なり率の閾値を 0.7→0.82 に引き上げ（生の声をエコーと誤判定しにくく）
function isEcho(transcript, botText){
  const norm=s=>String(s||"").toLowerCase().replace(/[\s、。,.!！?？「」]/g,"");
  const bot=norm(botText!=null?botText:S._botText), t=norm(transcript);
  if(!bot || !t) return false;
  if(t.length<4) return false;                          // 短い声はエコー扱いしない
  if(bot.includes(t) || t.includes(bot)) return true;   // 完全/部分一致
  const set=new Set(bot); let common=0; const tset=new Set(t);
  tset.forEach(ch=>{ if(set.has(ch)) common++; });
  return common/Math.max(1,tset.size) > 0.82;
}
// 発話“直後”の遅延エコー判定。speaking=false になった後でも、直近数件の bot 発話
// （ECHO_GUARD_MS 窓内）に一致する認識結果はエコーとみなして破棄する。これで
// 「◯◯を設定しました」「高速使いますか?」等のTTSがコマンド化して確認ループになるのを防ぐ。
function isLateEcho(transcript){
  const buf=S._echoBuf; if(!buf || !buf.length) return false;
  const now=Date.now();
  return buf.some(e => (now-e.at)<ECHO_GUARD_MS && isEcho(transcript, e.text));
}
// 高速バージイン用の“軽い”エコー判定。発話中に interim を拾った瞬間に TTS を止めるため、
// 「明確なエコー（botテキストに完全包含される長め文字列）」だけを弾き、それ以外は
// ユーザーの声とみなして即停止する（＝止まりやすい）。誤爆はログで後調整。
function isEchoLight(transcript){
  const norm=s=>String(s||"").toLowerCase().replace(/[\s、。,.!！?？「」]/g,"");
  const bot=norm(S._botText), t=norm(transcript);
  if(!bot || !t || t.length<4) return false;   // 短い声は止める側（エコー扱いしない）
  return bot.includes(t);                       // botに完全包含される時だけ明確なエコー
}
// エコー修正(1): interim バージインを抑止すべきか判定。null=抑止しない(バージインOK)、
// 文字列=抑止理由。安全即応ワード(ストップ/ミュート/リピート等)は絶対に抑止しない(条件4)。
//  - 自分の発話の部分文字列(substr) → 自TTSのエコー → 抑止
//  - 短すぎる断片(BARGE_MIN_LEN 未満) → エコー冒頭の可能性が高い → 抑止
const BARGE_MIN_LEN = 5;
const BARGE_RATIO = 0.9;   // 連続部分文字列でなくても文字重なり率がこれ以上ならエコー扱い
// 空白で区切った各断片が「いずれも自TTSの部分文字列」なら、離れた2箇所を合成したエコー。
// (echoDebug は空白除去後に判定するため、非連続な合成断片は substr:false になる。案1の本質は
//  『断片ごとの部分文字列判定』。連続1本の substr 判定とは別に用意する。)
function echoPartsSubstr(t){
  const norm=s=>String(s||"").toLowerCase().replace(/[\s、。,.!！?？「」]/g,"");
  const bot=norm(S._botText); if(!bot) return false;
  const parts=String(t||"").trim().split(/\s+/).map(norm).filter(p=>p.length>=2);
  if(parts.length<2) return false;               // 単一断片は既存 substr 判定に任せる
  return parts.every(p=>bot.includes(p));
}
function bargeSuppressReason(t){
  if(layer1Safety(t)) return null;                 // 条件4: 安全語は最速で止める（抑止しない）
  const clean=String(t||"").replace(/[\s、。,.!！?？「」]/g,"");
  if(clean.length < BARGE_MIN_LEN) return "too-short";
  const dbg=echoDebug(t);
  if(dbg.substr) return "substr";                  // 自TTSの連続部分文字列
  if(echoPartsSubstr(t)) return "substr-parts";    // 案1: 空白合成された断片（各片がエコー）
  if(dbg.ratio >= BARGE_RATIO) return "high-ratio"; // 案2: 非連続でも文字重なり率が高い
  return null;
}
// [TEMP-BARGEIN] 診断用: isEcho の内訳（部分一致か / 文字重なり率）を返す（検証後に削除）
function echoDebug(transcript){
  const norm=s=>String(s||"").toLowerCase().replace(/[\s、。,.!！?？「」]/g,"");
  const bot=norm(S._botText), t=norm(transcript);
  if(!bot || !t) return {substr:false, ratio:0, tLen:t.length};
  const substr = bot.includes(t) || t.includes(bot);
  const set=new Set(bot); let common=0; const tset=new Set(t);
  tset.forEach(ch=>{ if(set.has(ch)) common++; });
  return { substr, ratio:+(common/Math.max(1,tset.size)).toFixed(2), tLen:t.length };
}
// メッセージ末尾に、実際に鳴ったエンジンの小さなバッジを付ける（可視化）。
// 内蔵に落ちた場合は理由を badge の tooltip(title) に載せる（ホバーで原因が分かる）。

/* ============================ 音声認識 (STT / ハンズフリー) ============================ */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
// 掃除: STTライフサイクル(onstart/onend/restart)は no-speech で高頻度に発火しログを埋める。
// 5秒に1回だけ出力するスロットル（エラー/watchdog/バージインは従来通り毎回出す）。
let _sttLogAt=0;
function sttLog(msg){ const n=Date.now(); if(n-_sttLogAt<5000) return; _sttLogAt=n; console.log(msg); }
let recog=null;
let listening=false;    // 実際に認識中か
let wantListen=false;   // ハンズフリーを継続したいか（ユーザー意図）
let speaking=false;     // TTS発話中か（自分の声を拾わないため）
let ignoreUntil=0;      // 発話直後のエコー無視の締切(ms)
let restartTimer=null;

function buildRecog(){
  if(!SR) return null;
  const r=new SR();
  r.lang = S.lang==="ja" ? "ja-JP" : "en-US";
  // interim を有効化：発話が確定する前（喋り始め）に TTS を止められる＝バージインが速い。
  r.interimResults=true; r.maxAlternatives=1;
  r.continuous=true;    // ← 連続認識（ボタンを押し続けなくてよい）
  r.onstart=()=>{ listening=true; _restarting=false; updateMicUI(); sttLog("[MulmoNavi STT] onstart (listening)"); };
  r.onend=()=>{
    listening=false; updateMicUI();
    sttLog("[MulmoNavi STT] onend (wantListen="+wantListen+") → "+(wantListen?"restart":"stay"));
    // ブラウザは無音/一定時間で勝手に停止するので、意図が続く限り自動再開
    // 掃除: no-speech の連続再起動でログが埋まるため間隔を 250→600ms に緩和（watchdog=2500 が保険）。
    if(wantListen) scheduleRestart(600);
  };
  r.onerror=e=>{
    console.log("[MulmoNavi STT] onerror:", e && e.error);
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      wantListen=false; localStorage.setItem("nav_handsfree","0");
      updateMicUI(); toast(T().micDenied); return;
    }
    // no-speech / aborted / network 等は onend の自動再開に任せる
  };
  // 各 final result を「このrecognizerで」一度だけ処理する。continuous認識では
  // 同一resultに対し onresult が複数回発火することがあり、二重発火の原因になる。
  r._done=0;
  r.onresult=e=>{
    for(let i=e.resultIndex; i<e.results.length; i++){
      const res=e.results[i];
      if(!res) continue;
      const t=(res[0]&&res[0].transcript||"").trim();
      if(!t) continue;
      const nowMs=Date.now();

      // ── 高速バージイン（最優先）──
      // AI発話中に、明確なエコーでない声を interim の時点で拾ったら、final を待たず
      // 即座に TTS を止める。1発話につき1回だけ（S._barged）。誤爆はログで後調整。
      if(speaking && nowMs>=ignoreUntil && !isEchoLight(t)){
        // エコー修正(1): 自TTSの部分文字列/短すぎる断片は STOP@interim を発動しない
        // （安全語は bargeSuppressReason が null を返すので従来通り即停止）。
        const sup = bargeSuppressReason(t);
        if(sup){
          const dbg=echoDebug(t);
          console.log("[MulmoNavi ECHO] suppressed", { reason:sup, transcript:t, tLen:dbg.tLen, substr:dbg.substr });
        }else if(!S._barged){
          S._barged=true; flushTts();
          console.log("[MulmoNavi BARGEIN] STOP@"+(res.isFinal?"final":"interim"), { transcript:t, ...echoDebug(t) });
        }
      }

      if(!res.isFinal) continue;         // interim は「停止」までで終わり（コマンド化しない）
      if(i < r._done) continue;          // 既処理indexは無視（二重発火防止）
      r._done = i+1;

      // [TEMP-BARGEIN] final の診断ログ（検証後に削除）
      {
        const inSpeech=speaking, ignoreActive=nowMs<ignoreUntil, echo=inSpeech?isEcho(t):false;
        const verdict = ignoreActive ? "DROP(ignoreUntil)"
                      : (inSpeech && echo) ? "DROP(echo)"
                      : inSpeech ? "ACCEPT(barge-in)" : "ACCEPT(normal)";
        console.log("[MulmoNavi BARGEIN] final", { transcript:t, speaking:inSpeech, botText:S._botText,
          ignoreUntilActive:ignoreActive, isEcho:echo, ...echoDebug(t), verdict });
      }

      if(Date.now()<ignoreUntil) continue;   // 発話直後の残響だけは無視
      if(speaking && isEcho(t)) continue;     // 発話中の final がエコーならコマンド化しない
      // 発話“直後”の遅延エコー（speaking=falseでも）: 直近bot発話に一致 → 破棄（確認ループ防止）
      if(!speaking && isLateEcho(t)){ console.log("[MulmoNavi BARGEIN] DROP(late-echo)", JSON.stringify(t.slice(0,24))); continue; }
      if(speaking) flushTts();                // 念のため（interimで止め損ねた場合）
      S._barged=false;                        // コマンド確定 → 次発話のバージインを再武装
      handleInput(t);
    }
  };
  return r;
}
// recognizerを完全に破棄（ハンドラを全てnullにしてからstop）。onendだけ外して
// onresultを残すと、stop後にバッファされたfinal resultが漏れて二重発火する。
function killRecog(r){ if(!r) return; try{ r.onend=null; r.onresult=null; r.onerror=null; r.stop(); }catch(e){} }

let _restarting=false;
function scheduleRestart(delay){
  clearTimeout(restartTimer);
  restartTimer=setTimeout(()=>{
    restartTimer=null;
    if(!wantListen || listening || _restarting) return;
    _restarting=true;
    // 毎回フレッシュな認識器で再開する。同一 recog を再start するとブラウザは results
    // index を0に戻す一方、二重発火防止用の recog._done は前セッションの値のまま残り、
    // 新しい final が全て "i < _done" で破棄されて無反応になる（割り込み後に多発）。
    try{ killRecog(recog); }catch(e){}
    recog=buildRecog();
    try{ recog.start(); sttLog("[MulmoNavi STT] restart (fresh recog)"); }
    catch(e){ console.log("[MulmoNavi STT] restart failed:", e && e.message); _restarting=false; }
  }, delay||300);
}
// 自己修復ウォッチドッグ: ハンズフリー中なのに認識が止まっていたら再武装する
// （onend取りこぼし・start例外・割り込み後の停止などを一定周期で回復し、必ず「聞ける状態」へ戻す）。
setInterval(()=>{
  if(wantListen && !listening && !_restarting){ console.log("[MulmoNavi STT] watchdog → restart"); scheduleRestart(0); }
}, 2500);

function startHandsFree(){
  if(!SR){ toast("Speech recognition not supported"); return; }
  wantListen=true; localStorage.setItem("nav_handsfree","1");
  if(!recog) recog=buildRecog();
  updateMicUI();
  try{ recog.start(); }catch(e){ /* already running */ }
  botSay(T().listenOn, false);
}
function stopHandsFree(){
  wantListen=false; localStorage.setItem("nav_handsfree","0");
  clearTimeout(restartTimer);
  killRecog(recog);
  listening=false; recog=null; updateMicUI();
  botSay(T().listenOff, false);
}
function toggleMic(){ wantListen ? stopHandsFree() : startHandsFree(); }

// 言語切替を認識にも反映（聞いている最中なら作り直す）
function applyRecogLang(){
  if(!wantListen) return;
  killRecog(recog);   // 旧recognizerのonresultも外す（stop後の漏れfinalで二重発火しないように）
  recog=buildRecog(); scheduleRestart(200);
}

function updateMicUI(){
  const m=$("mic"); if(!m) return;
  m.classList.toggle("listening", !!wantListen);
  m.textContent = wantListen ? "🎙️" : "🎤";
  m.title = wantListen
    ? (S.lang==="ja"?"ハンズフリー中（タップで停止）":"Hands-free on (tap to stop)")
    : (S.lang==="ja"?"ハンズフリー開始":"Start hands-free");
}

async function initMaps(){
  const {Map} = await google.maps.importLibrary("maps");
  await google.maps.importLibrary("places");
  await google.maps.importLibrary("geometry");
  await google.maps.importLibrary("routes");

  S.map = new Map($("map"), {
    center:{lat:35.681236,lng:139.767125}, zoom:14,
    disableDefaultUI:true, gestureHandling:"greedy",
    styles: DARK_STYLE
  });
  S.dirService = new google.maps.DirectionsService();
  S.dirRenderer = new google.maps.DirectionsRenderer({
    map:S.map, suppressMarkers:false, preserveViewport:false,
    polylineOptions:{strokeColor:"#4c8dff",strokeWeight:7,strokeOpacity:.9}
  });
  S.places = new google.maps.places.PlacesService(S.map);
  S.geocoder = new google.maps.Geocoder();

  // [MAP-DIAG] 候補E検証: initMaps直後に地図コンテナのサイズ・可視性を1回だけダンプ（挙動変更なし）
  try{
    const el=$("map"), wrap=$("mapWrap"), cs=getComputedStyle(el);
    console.log("[MulmoNavi MAP] container@init", {
      mapOffsetW:el.offsetWidth, mapOffsetH:el.offsetHeight, isConnected:el.isConnected,
      display:cs.display, visibility:cs.visibility, position:cs.position, zIndex:cs.zIndex,
      wrapOffsetW:wrap?wrap.offsetWidth:null, wrapOffsetH:wrap?wrap.offsetHeight:null,
      innerW:window.innerWidth, innerH:window.innerHeight
    });
  }catch(e){ console.log("[MulmoNavi MAP] container@init err", e&&e.message); }

  // 地図上のスポット/地点クリック → そこへのルート検索候補にする
  S.map.addListener("click", (e)=>{
    if(e.placeId){
      // POI（お店・施設など）: 既定のGoogle Maps情報ウィンドウを抑止して目的地候補に
      if(typeof e.stop==="function") e.stop();
      pickPlaceAsDestination(e.placeId, e.latLng);
    }else if(e.latLng){
      pickLatLngAsDestination(e.latLng);
    }
  });

  startGeolocation();
  botSay(T().hello, false);
  renderChips();
  applyPresetDestination();
}

/* URLパラメータ ?to=行き先 / ?dest=行き先 で目的地を自動検索 */
function applyPresetDestination(){
  try{
    const p=new URLSearchParams(location.search);
    const to=(p.get("to")||p.get("dest")||"").trim();
    if(!to) return;
    if(p.get("mode")==="walk"||p.get("mode")==="walking") S.travelMode="WALKING";
    // 保存済みの行き先へ直行（確認ステップはスキップ）
    setTimeout(()=>{ addMsg(to,"user"); searchDestination(to,{confirm:false}); }, 1200);
  }catch(e){}
}

/* ============================ 現在地 ============================ */
function startGeolocation(){
  if(!navigator.geolocation){ addMsg(T().locDenied,"sys"); return; }
  addMsg(T().locating,"sys");
  navigator.geolocation.getCurrentPosition(pos=>{
    updateMe(pos); S.map.setCenter(S.me); S.map.setZoom(16);
  }, err=>{ addMsg(T().locDenied,"sys"); },
  {enableHighAccuracy:true,timeout:10000,maximumAge:5000});
}
function updateMe(pos){
  S.me = {lat:pos.coords.latitude, lng:pos.coords.longitude};
  S.origin = S.me;
  const heading = pos.coords.heading;
  if(!S.meMarker){
    S.meMarker = new google.maps.Marker({
      map:S.map, position:S.me, zIndex:999,
      icon:{path:google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale:6,
        fillColor:"#2ee6a6", fillOpacity:1, strokeColor:"#04231a", strokeWeight:2,
        rotation: heading||0}
    });
  }else{
    S.meMarker.setPosition(S.me);
    if(heading!=null && !isNaN(heading)){const ic=S.meMarker.getIcon();ic.rotation=heading;S.meMarker.setIcon(ic);}
  }
  maybeUpdateTown();   // 現在地の町名をcontext用にキャッシュ（内部で45秒スロットル）
}
$("recenter").onclick=()=>{ if(S.me){S.map.panTo(S.me); if(!S.navOn)S.map.setZoom(16);} else startGeolocation(); };

// LLM(tools)へ移行済み。extractDestQuery / isExplicitDest / CATEGORIES と共に M4 で撤去予定。
function parseIntent(raw){
  const t = raw.trim();
  const low = t.toLowerCase();
  // 先頭の相づち・フィラーを取り除いた変種でも会話判定する
  // （「はいこんにちは」「うん ありがとう」等が目的地検索に落ちないように）
  const c = t.replace(/^\s*((はい|うん|ええと?|あの[ーぉ]?|えっと|ねえ|ねぇ|なあ|なぁ|ちょっと|そうだ|じゃあ|では|もしもし|ねぇねぇ|well|um+|uh+|ok|okay)[\s、,。!！]*)+/i, "").trim() || t;
  // ヘルプ
  if(/^(help|ヘルプ|使い方|何ができる|操作)/i.test(t)) return {type:"help"};
  // あいさつ・相づち・お礼・雑談（ナビしない）
  const isGreet = s=>/^(こんにち[はわ]|こんばん[はわ]|おはよ[うー]?|おっす|やあ|やっほ[ーぉ]?|どうも|はじめまして|ごきげんよう|ちわ[っす]*|ちー?す|hi|hello|hey|hiya|yo|ハロー|ヘイ)[\s!！。、.…ー～]*$/i.test(s);
  if(isGreet(t) || isGreet(c)) return {type:"greet"};
  const isThanks = s=>/^(どうも ?)?(ありがと[うございました]*|あざ[すっ]*|感謝|thanks?|thank you|thx|ありがとねー?)[\s!！。、.…]*$/i.test(s);
  if(isThanks(t) || isThanks(c)) return {type:"thanks"};
  if(/^(ok|okay|オッケー?|おっけー?|了解|りょ|わかった|わかりました|はい|うん|うんうん|yes|yep|no|nope|いいえ|大丈夫|だいじょうぶ)[\s!！。、.…]*$/i.test(t)) return {type:"ack"};
  const isChat = s=>/^(元気|調子どう|お元気|how are you|君は誰|あなた誰|誰|だれ|名前は?|who are you|なにこれ|何これ|テスト|test|やあ|ねえ|ねぇ)[\s!！。、.？?…]*$/i.test(s);
  if(isChat(t) || isChat(c)) return {type:"chat"};
  // ナビ停止
  if(/(やめ|終了|停止|キャンセル|stop|cancel|end nav|案内をやめ)/i.test(t)) return {type:"stopNav"};
  // ナビ開始
  if(/(ナビ開始|案内(して|開始|スタート)|出発|しゅっぱつ|go now|start nav|let'?s go|案内お願い)/i.test(t)) return {type:"startNav"};
  // 次どっち
  if(/(次どっち|次はどっち|どこ曲が|どっち|次の曲がり|どこを曲|which way|next turn|where.*turn|repeat)/i.test(t)) return {type:"repeat"};
  // 移動手段
  if(/(徒歩|歩いて|walk|on foot)/i.test(t)) return {type:"mode", mode:"WALKING"};
  if(/(車で|運転|ドライブ|by car|driving|drive)/i.test(t) && !/(コンビニ|寄|近く)/.test(t)) return {type:"mode", mode:"DRIVING"};

  // 話し言葉から目的地クエリを抽出（語尾ゆれ・丁寧表現に強く）
  const q = extractDestQuery(t);

  // カテゴリ（コンビニ/駐車場/カフェ 等）。寄り道ヒント＝「近く/寄って/途中/ついでに…」
  const detourHint = /(寄って|寄る|よって|近く|ちかく|nearby|near me|nearest|closest|on the way|途中|ついでに)/i.test(t);
  for(const c of CATEGORIES){
    if(c.re.test(t)){
      // 経由地(detour)にするのは「ナビ中」or「既に目的地があり寄り道ヒント有り」の時だけ。
      // それ以外（目的地未設定など）は、そのカテゴリ/地名を“目的地”として検索する。
      return {type:"category", cat:c, query:q, detourHint};
    }
  }

  // 既定を反転：明示的な「行き先マーカー」がある時だけ直接ジオコード（速い・確定的）。
  // それ以外は全て nav-chat(LLM)へ委ねる → 目的地の誤爆を防ぎ、自然な会話ができる。
  // LLMは雑談なら会話で返し、地名/施設名なら {action:"set_destination"} を返す。
  if(q && isExplicitDest(t)) return {type:"destination", query: q};
  return {type:"chat"};
}
// 明示的な行き先指定か（高精度：無ければLLMに任せるので誤爆しても会話で拾える）
function isExplicitDest(t){
  if(/(まで|案内(して|お願い)|ナビ(して|お願い)|連れて[行っいく]|目的地(は|に|を)?|へ行|に行(き|っ|こ)|に向か|へ向か)/.test(t)) return true;
  if(/[^\s]へ[\s、。!！]*$/.test(String(t).trim())) return true;   // 末尾の方向助詞「へ」（例：東京駅へ）
  if(/\b(take me to|navigate to|drive to|go to|head to)\b/i.test(t)) return true;
  return false;
}

/* 話し言葉から目的地クエリを抽出。
   例: 「栃木県の男体山の駐車場まで連れて行ってください」→「栃木県の男体山の駐車場」
       「近くのコンビニに行きたいです」→「近くのコンビニ」
       「take me to Tokyo Station please」→「Tokyo Station」 */
function extractDestQuery(raw){
  let q = (raw||"");
  // 先頭のフィラー
  q = q.replace(/^\s*(えっと|ええと|あの|あのー|うーんと?|そうだ|じゃあ|では|やっぱり|やっぱ)\s*[、,]?\s*/ig,"");
  // 行き先変更の枕詞（日本語）
  q = q.replace(/(行き先を|行き先は|目的地を|目的地は|目的地に)/g,"");
  // 日本語: 助詞(まで/へ/に)＋移動動詞をまとめて除去
  q = q.replace(/(まで|へ|に)?\s*(連れて行って|連れてって|連れていって|行きたい|行って|行こう|向かって|向かいたい|案内して|案内お願いします|案内お願い|ナビして|案内)/g,"");
  // 日本語: 文末の丁寧表現・語尾
  q = q.replace(/(ください|下さい|お願いします|お願いね|お願い|ちょうだい|頂戴|です|でお願いします|して|ね|よ|な)+\s*$/g,"");
  // 日本語: 文末に残った助詞
  q = q.replace(/(まで|へ|に)\s*$/,"");
  // 英語: 前置の移動表現（語境界つきで "Tokyo" 等を誤爆させない）
  q = q.replace(/\b(please\s+)?(navigate to|take me to|drive to|walk to|head to|directions?\s+to|route to|go to|to)\b\s*/ig," ");
  q = q.replace(/\b(change|set)\s+destination\s+to\b\s*/ig," ");
  // 英語: 文末の丁寧語
  q = q.replace(/\b(please|thanks|thank you)\b\s*$/ig,"");
  // 記号・空白整理
  q = q.replace(/[、。,]/g," ").replace(/\s+/g," ").trim();
  return q;
}

/* ============================ 入力ハンドラ ============================ */
let _lastSubmit={text:"",at:0};
function handleInput(raw){
  const t=(raw||"").trim(); if(!t) return;
  // 二重発火ガード: 同一発話が短時間に2回来たら2回目を落とす（1発話=1リクエスト=1再生を保証）
  const now=(window.performance&&performance.now)?performance.now():Date.now();
  if(t===_lastSubmit.text && (now-_lastSubmit.at)<1500){
    console.log("[MulmoNavi] duplicate input dropped:", JSON.stringify(t));
    return;
  }
  _lastSubmit={text:t, at:now};
  flushTts();   // 新しいユーザー発話 → 進行中の読み上げを止めキューを空に（重なり防止）
  addMsg(t,"user"); $("text").value="";
  // 記憶の削除確認中（item6: 削除は必ず声で確認）
  if(S.pendingForget){
    const d=classifyConfirm(t);
    if(d==="yes"){ const key=S.pendingForget.key; if(S.pendingForget.timer)clearTimeout(S.pendingForget.timer); S.pendingForget=null; confirmForget(key); return; }
    if(d==="no"||d==="cancel"){ cancelForget("declined"); botSay(S.lang==="ja"?"消すのはやめました。":"Kept it."); return; }
    cancelForget("superseded");   // それ以外は破棄して通常処理へ
  }
  // 高速（有料道路）を使うかの確認中は最優先で解釈
  if(S.pendingRoad){
    const r=classifyRoad(t);
    if(r==="yes"){ S.avoidTolls=false; S.avoidHighways=false; S.pendingRoad=false; S.roadChosen=true; botSay(T().tollUse); buildRoute(); return; }
    if(r==="no"){ S.avoidTolls=true; S.avoidHighways=true; S.pendingRoad=false; S.roadChosen=true; botSay(T().tollAvoid); buildRoute(); return; }
    // それ以外は新しい指示とみなし、確認を破棄して通常処理へ
    S.pendingRoad=false;
  }
  // 目的地確認中は はい/違う/キャンセル を最優先で解釈
  if(S.pending){
    const d=classifyConfirm(t);
    if(d==="yes"){ confirmCandidate(); return; }
    if(d==="no"){ nextCandidate(); return; }
    if(d==="cancel"){ botSay(T().confirmCancel); clearPending(); return; }
    // それ以外は新しい指示とみなし、確認を破棄して通常処理へ
    clearPending();
  }
  // ── M2: AI-native ルーティング ──
  // 第1層は「安全・即応ワード」だけをローカル即実行（LLM往復を待たない）。
  // それ以外の全発話は /api/nav-chat(mode:"tools") へ委ね、LLMが道具呼び出しか
  // 会話かを判断する。これで「高速やめて下道で」等の言い回しの誤爆が無くなる。
  const safe = layer1Safety(t);
  if(safe==="stopNav"){ stopNav(); return; }
  if(safe==="startNav"){ startNav(); return; }
  if(safe==="mute"){ muteTts(); return; }
  if(safe==="repeat"){ repeatStep(); return; }
  navChatReply(t, fallbackKind(t));
}
/* 第1層＝安全・即応ワードのみ。^…$ でアンカーし、「高速やめて下道で」のような
   語を含むだけの発話は誤マッチさせない（それは stop ではなく change_route）。 */
function layer1Safety(t){
  const s=(t||"").trim();
  if(/^(?:(?:ナビ|案内)?\s*を?\s*(?:やめて|やめる|止めて|停止|終了|ストップ|キャンセル)|stop|cancel|end nav|quit)[\s。.．！!]*$/i.test(s)) return "stopNav";
  // ナビ開始（route操作ではないので DSL でなくローカル即応）。RouteIntent には含めない。
  if(/^(?:ナビ(?:を)?(?:開始|スタート)|案内(?:して|開始|スタート|お願い)|出発(?:して|しよう|しましょう)?|しゅっぱつ|go\b|start(?:\s*nav(?:igation)?)?|let'?s go)[\s。.．！!]*$/i.test(s)) return "startNav";
  if(/^(?:(?:ミュート|消音)(?:に)?(?:して)?|静かに(?:して)?|しずかに(?:して)?|黙(?:って|る)|mute|quiet|be quiet|shut up)[\s。.．！!]*$/i.test(s)) return "mute";
  if(/^(?:次どっち|次はどっち|次どこ|もう一回|もういちど|もう一度|どっちだっけ|repeat|again|say again)[\s。.．？?！!]*$/i.test(s)) return "repeat";
  return null;
}
/* LLM不達時のフォールバック定型文の種別選択のみ（※ルーティングはしない。全発話はLLMへ行く）。 */
function fallbackKind(t){
  const s=(t||"");
  if(/(ありがと|あざ|thanks|thank you|thx)/i.test(s)) return "thanks";
  if(/(こんにち|こんばん|おはよ|やあ|hi|hello|hey|ハロー)/i.test(s)) return "greet";
  if(/^(help|ヘルプ|使い方|何ができる)/i.test(s)) return "help";
  return "chat";
}
$("send").onclick=()=>handleInput($("text").value);
$("text").addEventListener("keydown",e=>{if(e.key==="Enter")handleInput($("text").value);});
$("mic").onclick=toggleMic;

/* ============================ 第2層：LLM会話（/api/nav-chat） ============================ */
// 第1層で会話系に落ちた発話をサーバー経由でLLMに投げ、短い相棒応答／操作アクションを得る。
// トークン未取得・失敗・タイムアウト時は定型文にフォールバック（会話を止めない）。
// true=RouteIntent DSL経路（新）／false=差分ツール経路（旧・ロールバック用・残置）。
const USE_INTENT = true;
async function navChatReply(userText, fallbackType){
  if(!S.navChatToken || !S.navChatUrl){ botSay(cannedFor(fallbackType)); return; }
  const ctrl=new AbortController();
  S.navAbort=ctrl;                 // バージイン(flushTts)から中断できるよう保持
  const to=setTimeout(()=>ctrl.abort(), NAV_CHAT_TIMEOUT_MS);
  const tReq=performance.now();
  const post=(extra)=>fetch(S.navChatUrl,{ method:"POST",
    headers:{ "Authorization":"Bearer "+S.navChatToken, "Content-Type":"application/json" },
    body: JSON.stringify(Object.assign({ message:userText, context: buildNavContext() }, extra)), signal: ctrl.signal });
  try{
    if(USE_INTENT){
      console.log("[MulmoNavi] path=intent");
      const res=await post({ mode:"intent" });
      if(!res.ok) throw new Error("http "+res.status);
      const data=await res.json();   // 封筒 {intent, actions, say}（後方互換: intent のみでも可）
      if(data && (data.intent || data.actions)){
        // 問題1/2: 実測が無いのに数値を含む say は捏造 → 安全文言に差し替え（検知だけでなく遮断）。
        const willCompute=!!(data.intent && data.intent.destination);
        const safeSay=guardSay((data.intent&&data.intent.say)||data.say, willCompute);
        if(data.intent && typeof data.intent.say==="string") data.intent.say=safeSay;
        if(typeof data.say==="string") data.say=safeSay;
        if(data.actions) dispatchActions(data.actions);       // 経路以外（記憶/音楽/削除確認）
        if(data.intent) await applyRouteIntent(data.intent);  // 経路＋say読み上げ
        else if(data.say) botSay(String(data.say));
        return;
      }
      botSay(cannedFor(fallbackType)); return;
    }
    // ── 旧経路（差分ツール／ストリーミング）残置（USE_INTENT=false で有効・ロールバック用）──
    console.log("[MulmoNavi] path=tools");
    let res=await post({ mode:"tools", stream:true });
    const ct=(res.headers.get("content-type")||"");
    if(res.ok && res.body && ct.includes("text/event-stream")){
      await consumeNavStream(res, tReq, fallbackType); return;
    }
    console.log("[MulmoNavi] stream unavailable (status="+res.status+", ct="+ct+") → non-stream fallback");
    if(!(res.ok && ct.includes("application/json"))) res=await post({ mode:"tools" });
    if(!res.ok) throw new Error("http "+res.status);
    const data=await res.json();
    const tRecv=performance.now();
    if(data && typeof data.tool==="string"){ handleToolCall(data); return; }
    if(data && typeof data.action==="string"){ handleLLMAction(data); return; }
    if(data && typeof data.reply==="string" && data.reply.trim()){ botSay(data.reply.trim(), true, { cache:false, sinceRecv:tRecv }); return; }
    botSay(cannedFor(fallbackType));
  }catch(e){
    if(ctrl.signal.aborted) return;   // ユーザー割り込み等 → フォールバックしない
    botSay(cannedFor(fallbackType));   // 不達/失敗 → 定型文
  }finally{
    clearTimeout(to);
    if(S.navAbort===ctrl) S.navAbort=null;
  }
}

/* ============================ RouteIntent DSL エンジン ============================
   nav-chat(mode:"intent")が返す部分的な RouteIntent を、前回状態にマージ→差分判定→
   変化があれば地名解決→buildRoute。未指定は前回値維持（返し漏れ耐性）。 */
function cloneIntent(x){ return { origin:x.origin, destination:x.destination?{query:x.destination.query}:null,
  via:(x.via||[]).map(v=>({query:v.query})), prefer:{avoidHighways:!!x.prefer.avoidHighways, avoidTolls:!!x.prefer.avoidTolls} }; }
// 受信の部分Intentを前回状態にマージ（item3/9: 未指定=維持, via=完全配列, prefer=サブ項目維持）
function mergeIntent(prev, inc){
  inc = inc || {};
  const m = cloneIntent(prev);
  if(inc.origin==="current") m.origin="current";
  else if(inc.origin && typeof inc.origin==="object" && inc.origin.query) m.origin={query:String(inc.origin.query)};
  else if(typeof inc.origin==="string" && inc.origin.trim()) m.origin = (inc.origin==="current"?"current":{query:inc.origin.trim()});
  if(inc.destination && typeof inc.destination==="object" && inc.destination.query) m.destination={query:String(inc.destination.query)};
  else if(typeof inc.destination==="string" && inc.destination.trim()) m.destination={query:inc.destination.trim()};
  if(Array.isArray(inc.via)) m.via = inc.via.map(v=> typeof v==="string"?{query:v}:(v&&v.query?{query:String(v.query)}:null)).filter(Boolean);
  if(inc.prefer && typeof inc.prefer==="object"){
    if(typeof inc.prefer.avoidHighways==="boolean") m.prefer.avoidHighways=inc.prefer.avoidHighways;
    if(typeof inc.prefer.avoidTolls==="boolean") m.prefer.avoidTolls=inc.prefer.avoidTolls;
  }
  return m;
}
function diffIntent(a,b){
  const d=[];
  if(JSON.stringify(a.origin)!==JSON.stringify(b.origin)) d.push("origin");
  if(JSON.stringify(a.destination)!==JSON.stringify(b.destination)) d.push("destination");
  if(JSON.stringify(a.via)!==JSON.stringify(b.via)) d.push("via");
  if(JSON.stringify(a.prefer)!==JSON.stringify(b.prefer)) d.push("prefer");
  return d;
}
// 「近くの〜/コンビニ/トイレ」等のカテゴリ検索か（＝現在地バイアスが正しいもの）を判定。
function isCategoryQuery(query){
  const s=String(query||"");
  if(/近く|ちかく|周辺|近隣|この先|nearby|nearest|closest|around/i.test(s)) return true;
  for(const c of CATEGORIES){ if(c.re.test(s)) return true; }   // コンビニ/GS/トイレ/カフェ 等
  return false;
}
const PLACE_TIMEOUT_MS = 10000;
// 認識結果を {loc,name} に。1次検索が空/失敗なら geocoder フォールバック。全経路で必ず
// finish(=resolve) を呼び、失敗時は [MulmoNavi ORIGIN] FAILED を出す（無言終了を残さない）。
function _placeFromResult(res, st, query, finish){
  try{
    if(st===google.maps.places.PlacesServiceStatus.OK && res && res[0] && res[0].geometry && res[0].geometry.location){
      finish({loc:res[0].geometry.location, name:res[0].name||query}); return;
    }
    if(S.geocoder){
      S.geocoder.geocode({address:String(query)},(gr,gs)=>{
        if(gs==="OK" && gr && gr[0]){ finish({loc:gr[0].geometry.location, name:query}); }
        else { console.log("[MulmoNavi ORIGIN] FAILED", { query, status:String(st)+"/"+String(gs), error:"no result (place+geocode)" }); finish(null); }
      });
    }else{ console.log("[MulmoNavi ORIGIN] FAILED", { query, status:String(st), error:"no geocoder" }); finish(null); }
  }catch(e){ console.log("[MulmoNavi ORIGIN] FAILED", { query, status:"THROW", error:(e&&e.message)||String(e) }); finish(null); }
}
// 地名→latlng の共通解決（origin/destination/via 共通）。
// 問題1: 固有名詞→findPlaceFromQuery（bias無し）、カテゴリ→textSearch＋現在地バイアス。
// 緊急修正: タイムアウト＋例外捕捉。コールバック不発でもハングせず必ず結果/失敗をログ。
function resolvePlace(query){
  return new Promise((resolve)=>{
    if(!S.places || !query){ console.log("[MulmoNavi ORIGIN] FAILED", { query, status:"NO_PLACES", error:"places/query missing" }); resolve(null); return; }
    let done=false; let timer=null;
    const finish=(v)=>{ if(done)return; done=true; if(timer)clearTimeout(timer); resolve(v); };
    timer=setTimeout(()=>{ console.log("[MulmoNavi ORIGIN] FAILED", { query, status:"TIMEOUT", error:"no callback in "+PLACE_TIMEOUT_MS+"ms" }); finish(null); }, PLACE_TIMEOUT_MS);
    const cb=(res,st)=>_placeFromResult(res, st, query, finish);
    try{
      if(isCategoryQuery(query)){
        const req={ query:String(query) }; if(S.me){ req.location=S.me; req.radius=30000; }   // カテゴリ=現在地バイアス
        S.places.textSearch(req, cb);
      }else{
        S.places.findPlaceFromQuery({ query:String(query), fields:["name","geometry"] }, cb);   // 固有名詞=bias無し
      }
    }catch(e){ console.log("[MulmoNavi ORIGIN] FAILED", { query, status:"THROW", error:(e&&e.message)||String(e) }); finish(null); }
  });
}
// マージ後Intentを実状態(S.destination/originOverride/waypoints/prefer)へ解決。gen で後勝ち。
async function resolveIntentToState(m, gen, changedPrefer){
  if(m.origin==="current"){ S.originOverride=null; S.originName=null; }
  else if(m.origin && m.origin.query){
    const r=await resolvePlace(m.origin.query); if(gen!==S.intentSeq) return;
    if(r){ S.originOverride=r.loc; S.originName=r.name; }
  }
  if(m.destination && m.destination.query){
    const r=await resolvePlace(m.destination.query); if(gen!==S.intentSeq) return;
    if(r){ S.destination=r.loc; S.destName=r.name; }
  }
  const via=[];
  for(const v of (m.via||[])){ const r=await resolvePlace(v.query); if(gen!==S.intentSeq) return; if(r) via.push({loc:r.loc, name:r.name}); }
  S.waypoints = via;
  S.avoidHighways=!!m.prefer.avoidHighways; S.avoidTolls=!!m.prefer.avoidTolls;
  if(changedPrefer) S.roadChosen=true;   // 道種は決定済み扱い（以後高速確認しない）
  const isCurrent = (m.origin==="current");
  console.log("[MulmoNavi ORIGIN] resolved", {
    name: isCurrent?"current":(S.originName||null), isCurrent,
    lat: isCurrent?(S.me?S.me.lat:null):(S.originOverride&&S.originOverride.lat&&S.originOverride.lat()),
    lng: isCurrent?(S.me?S.me.lng:null):(S.originOverride&&S.originOverride.lng&&S.originOverride.lng())
  });
}
// 経路要求を適用。未指定維持マージ→差分→（nav変化あれば）解決→buildRoute。後勝ち世代ガード付き。
async function applyRouteIntent(intent){
  const gen = ++S.intentSeq;
  console.log("[MulmoNavi INTENT] received", JSON.stringify(intent||{}), "gen", gen);
  if(!intent || typeof intent!=="object"){ console.log("[MulmoNavi INTENT] invalid → keep prev, noop", gen); return; }
  const prev = S.routeIntent;
  const merged = mergeIntent(prev, intent);
  const diff = diffIntent(prev, merged);
  S.routeIntent = merged;
  console.log("[MulmoNavi INTENT] merged", JSON.stringify(merged), "diff", JSON.stringify(diff), "gen", gen);
  const say = (intent && typeof intent.say==="string") ? intent.say.trim() : "";
  const navChanged = diff.length>0;
  if(navChanged) cancelForget("superseded-by-intent");   // 問題4: 別の意図が来たら削除確認を破棄
  if(!navChanged){
    // 問題1-3: 完全無反応を避ける。sayがあれば喋り、無ければ短い相槌/状態確認。
    console.log("[MulmoNavi INTENT] action=noop gen", gen);
    botSay(say || noopReply());
    updateOriginUI();
    return;
  }
  // 問題2: prefer だけの変更は、地名解決の前にキャッシュ再描画で片付ける（Placesの無駄呼び出し回避）。
  const onlyPrefer = diff.length===1 && diff[0]==="prefer";
  if(onlyPrefer && S.compare && (S.compare.hwy || S.compare.local)){
    S.avoidHighways=!!merged.prefer.avoidHighways; S.avoidTolls=!!merged.prefer.avoidTolls; S.roadChosen=true;
    const preferLocal=!!S.avoidHighways;
    const chosen = preferLocal ? (S.compare.local||S.compare.hwy) : (S.compare.hwy||S.compare.local);
    if(chosen){
      let setOk=true; try{ S.dirRenderer.setDirections(chosen.res); }catch(e){ setOk=false; }
      S.route=chosen.res.routes[0]; S.steps=S.route.legs.flatMap(l=>l.steps); S.curStep=0; S.lastSpokenStep=-1; renderSteps(); updateCompareUI();
      logRouteApplied(chosen, preferLocal, true, gen, setOk);   // 問題3: ROUTE applied（掃除リスト1）
      console.log("[MulmoNavi INTENT] prefer-only → re-render from cache (no geocode) gen", gen);
      // 統合: 初回と同じ「選択側+もう一方+料金(キャッシュ)」形式で発話（TOLL再呼び出しなし）。
      botSay(say || buildCompareLine(preferLocal), true, {cache:false});
      return;
    }
  }
  try{
    await resolveIntentToState(merged, gen, diff.indexOf("prefer")>=0);
    if(gen!==S.intentSeq){ console.log("[MulmoNavi INTENT] superseded gen", gen); return; }   // item8 後勝ち
    updateOriginUI();
    if(!S.destination){ console.log("[MulmoNavi INTENT] action=noop(no destination) gen", gen); botSay(say||T().needDest); return; }
    console.log("[MulmoNavi INTENT] action=buildRoutePair gen", gen);
    await buildRoutePair(gen, say);   // await: 内部throwを握りつぶさず下のcatchで拾う
  }catch(e){
    console.log("[MulmoNavi INTENT] resolve error", e&&e.message);
    botSay(say||cannedFor("chat"));
  }
}
// 問題1: prefer-only 等で say が無いとき、キャッシュ済みの数字から必ず文言を組み立てる。
function preferredLine(info, preferLocal){
  if(!info) return T().chat;
  const ja=S.lang==="ja";
  return ja ? `${preferLocal?"下道":"高速"}で${durMin(info.dur)}分、${etaClock(info.dur)}着です。`
            : `${preferLocal?"Local roads":"Highway"} ${durMin(info.dur)} min, arriving ${etaClock(info.dur)}.`;
}
// 問題1-3: diff空の noop でも短い相槌/状態確認を返す（完全無反応を避ける）。
function noopReply(){
  if(S.destName) return S.lang==="ja" ? `${S.destName}へ向かっています。` : `Heading to ${S.destName}.`;
  return T().chat;
}
// 問題3: 描画した側(chosen)の診断を1行で出す（buildRoutePair / prefer-only 共通）。
function _coord(x){ if(!x) return {lat:null,lng:null}; try{ return {lat: typeof x.lat==="function"?x.lat():x.lat, lng: typeof x.lng==="function"?x.lng():x.lng}; }catch(e){ return {lat:"err",lng:"err"}; } }
function logRouteApplied(info, preferLocal, wasReroute, gen, setOk){
  const originLatLng = S.originOverride || (S.me ? {lat:S.me.lat,lng:S.me.lng} : null);
  const o=_coord(originLatLng), d=_coord(S.destination);
  console.log("[MulmoNavi ROUTE] applied", {
    seq:gen, chosen: preferLocal?"local":"hwy",
    originName: S.originOverride?(S.originName||null):"current", originIsCurrent: !S.originOverride, originLat:o.lat, originLng:o.lng,
    destName:S.destName, destLat:d.lat, destLng:d.lng,
    distM: info?info.dist:null, timeS: info?info.dur:null, avoidHighways:!!S.avoidHighways, reroute:!!wasReroute,
    setDirections: setOk!==false,
    rendererHasMap: (function(){try{return !!(S.dirRenderer.getMap&&S.dirRenderer.getMap());}catch(e){return "err";}})(),
    rendererMapIsAppMap: (function(){try{return S.dirRenderer.getMap()===S.map;}catch(e){return "err";}})(),
    navOn:S.navOn
  });
}
/* ============================ M3: アクション ディスパッチャ ============================
   封筒(envelope)の actions を type ごとに振り分ける。記憶(remember/recall)はサーバーで
   実行済み・say に反映済みなのでログのみ。forget は声で確認してから削除（item6）。
   未知の type は無視してログに残す（LLMが将来別typeを返しても壊れない・item2/7）。 */
function dispatchActions(actions){
  if(!Array.isArray(actions)) return;
  for(const a of actions){
    if(!a || typeof a.type!=="string"){ console.log("[MulmoNavi ACTION] degraded", {type:a&&a.type, reason:"no type"}); continue; }
    switch(a.type){
      case "remember":   console.log("[MulmoNavi ACTION] remember (saved server-side)", {key:a.key}); break;
      case "recall":     console.log("[MulmoNavi ACTION] recall (in say)", {count:a.count}); break;
      case "forget":     armForget(a.key); break;  // item6: 削除は声で確認（問題4: タイムアウト付き）
      case "forget_done":console.log("[MulmoNavi ACTION] forget_done", {removed:a.removed}); console.log("[MulmoNavi ACTION] forget-key", {requested:a.requested, storedKeys:a.storedKeys||[]}); cancelForget("forget-done"); break;   // 問題2: 照合診断
      case "play_music": if(a.mood) toast((S.lang==="ja"?"🎵 音楽（準備中）：":"🎵 Music (coming soon): ")+a.mood); console.log("[MulmoNavi ACTION] play_music", {mood:a.mood}); break;
      default:           console.log("[MulmoNavi ACTION] degraded", {type:a.type, reason:"unknown type"});  // item7
    }
  }
}
// 問題4: 削除確認を武装（30秒タイムアウト付き）。放置で自動破棄し、後の「はい」で
// 無関係な記憶が消える事故を防ぐ。
const FORGET_TIMEOUT_MS = 30000;
function armForget(key){
  cancelForget("re-armed");
  S.pendingForget = { key, timer: setTimeout(()=>cancelForget("timeout"), FORGET_TIMEOUT_MS) };
  console.log("[MulmoNavi ACTION] forget → 声で確認", {key});
}
// 問題4: 削除確認を破棄（タイムアウト/別の意図/拒否）。forget-cancelled をログ。
function cancelForget(reason){
  if(!S.pendingForget) return;
  try{ if(S.pendingForget.timer) clearTimeout(S.pendingForget.timer); }catch(e){}
  S.pendingForget=null;
  console.log("[MulmoNavi ACTION] forget-cancelled", {reason});
}
// item6: 削除は声で確認済み → confirmForget を送りサーバーで実行。
async function confirmForget(key){
  if(!S.navChatToken || !S.navChatUrl){ botSay(cannedFor("chat")); return; }
  try{
    const res=await fetch(S.navChatUrl,{ method:"POST",
      headers:{ "Authorization":"Bearer "+S.navChatToken, "Content-Type":"application/json" },
      body: JSON.stringify({ message:"はい", mode:"intent", confirmForget:key, context: buildNavContext() }) });
    if(!res.ok) throw new Error("http "+res.status);
    const data=await res.json();
    if(data.actions) dispatchActions(data.actions);
    if(data.intent) await applyRouteIntent(data.intent); else if(data.say) botSay(String(data.say));
  }catch(e){ botSay(cannedFor("chat")); }
}
// item7: #sheet に出発地を表示。"current" は「現在地」。
function updateOriginUI(){
  const el=$("originText"); if(!el) return;
  const isCurrent = (S.routeIntent.origin==="current") || !S.originName;
  el.innerHTML = isCurrent ? (S.lang==="ja"?"現在地":"Current location")
                           : ("<b>"+String(S.originName).replace(/[&<>]/g,"")+"</b>"+(S.lang==="ja"?" から":" (start)"));
}
// 文末（。．！？.!?改行）で完全な文を切り出す。末尾の未完部分は rest に残す。
function extractSentences(text){
  const re=/[^。．.!！?？\n]*[。．.!！?？\n]/g;
  let m, sentences=[], last=0;
  while((m=re.exec(text))){ sentences.push(m[0]); last=re.lastIndex; }
  return { sentences, rest: text.slice(last) };
}
// SSEを逐次消費：contentデルタは文確定ごとにTTSへ、tool は handleToolCall へ。
async function consumeNavStream(res, tReq, fallbackType){
  const reader=res.body.getReader();
  const dec=new TextDecoder();
  let buf="", spoken="", pending="", bubble=null, spokeAny=false, firstAt=0, toolHandled=false;
  const speakSentence=(s)=>{
    const t=s.trim(); if(!t) return;
    if(!spokeAny){ spokeAny=true; firstAt=performance.now();
      console.log(`[MulmoNavi] nav-chat stream: 1st sentence @${Math.round(firstAt-tReq)}ms "${t.slice(0,20)}"`); }
    tts(t, { cache:false, el:bubble, sinceRecv:tReq });   // 直列キューに投入（第1文から即再生）
  };
  const onDelta=(text)=>{
    if(!bubble) bubble=addMsg("", "bot");
    pending += text;
    const { sentences, rest }=extractSentences(pending);
    pending=rest;
    for(const s of sentences){ spoken+=s; speakSentence(s); }
    bubble.textContent = spoken + pending;   // 未確定分も画面には表示
    $("log").scrollTop=$("log").scrollHeight;
  };
  while(true){
    const { value, done }=await reader.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    const lines=buf.split("\n"); buf=lines.pop()||"";
    for(const line of lines){
      const s=line.trim(); if(!s.startsWith("data:")) continue;
      let ev; try{ ev=JSON.parse(s.slice(5).trim()); }catch{ continue; }
      if(ev.type==="delta"){ onDelta(ev.text||""); }
      else if(ev.type==="tool"){ toolHandled=true; handleToolCall(ev); }   // 会話バブルは作られない（contentなし）
      else if(ev.type==="error"){ throw new Error("stream error"); }
      // "done" は while 終了で処理
    }
  }
  // 残りの未確定文を読み上げ＆表示
  if(pending.trim()){ spoken+=pending; if(bubble) bubble.textContent=spoken; speakSentence(pending); pending=""; }
  // content も tool も無い空レスポンス → 定型文でフォールバック（会話を止めない）
  if(!spokeAny && !toolHandled){ botSay(cannedFor(fallbackType)); }
}
function cannedFor(type){
  const m={ help:T().help, greet:T().greet, thanks:T().thanks, ack:T().ack, chat:T().chat };
  return m[type] || T().chat;
}
// LLMが返した操作アクションを既存関数にマッピング
function handleLLMAction(data){
  switch(data.action){
    case "set_destination": data.query ? searchDestination(data.query,{confirm:false}) : botSay(cannedFor("chat")); break;
    case "add_waypoint": data.query ? addWaypointByQuery(data.query) : botSay(cannedFor("chat")); break;
    case "start_nav": startNav(); break;
    case "stop_nav": stopNav(); break;
    case "repeat": repeatStep(); break;
    case "play_music": playMusicStub(data.mood); break;
    default: botSay(cannedFor("chat"));
  }
}

/* ============================ M1: AI-native tools ハンドラ ============================
   サーバ(/api/nav-chat, mode:"tools")が返す {tool,args} を既存の操作関数へマッピングする。
   ※M1では「定義するだけ」で、まだ呼び出さない（navChatReply は従来の action-JSON のまま）。
     M2 で navChatReply を mode:"tools" へ切り替え、この関数を配線する。 */
function handleToolCall(data){
  const a = (data && data.args) || {};
  switch(data.tool){
    case "navigate":
      // 行き先の新規設定/変更。avoidHighways 指定があれば道種フラグを確定（高速確認を省略）。
      if(typeof a.avoidHighways==="boolean"){ S.avoidHighways=a.avoidHighways; S.avoidTolls=a.avoidHighways; S.pendingRoad=false; S.roadChosen=true; }
      a.destination ? searchDestination(a.destination) : botSay(cannedFor("chat"));
      break;
    case "change_route":
      changeRoute(a); break;
    case "get_status":
      speakStatus(); break;                 // テンプレ生成（ETA幻覚防止・2往復禁止）
    case "search_poi":
      a.query ? addWaypointByQuery(a.query) : botSay(cannedFor("chat")); break;
    case "control":
      controlNav(a.action); break;
    case "play_music":
      playMusicStub(a.mood); break;
    case "remember":
      rememberFact(a.fact); break;          // M3でコレクション保存に差し替え
    case "recall":
      recallFact(a.topic); break;           // M3でコレクション想起に差し替え
    default:
      botSay(cannedFor("chat"));
  }
}
// 現在ルートの条件変更（高速回避の切替 / 経由地追加）。ナビは終了させない。
function changeRoute(a){
  if(a.addWaypoint){ addWaypointByQuery(a.addWaypoint); return; }   // 経由地追加（内部でリルート）
  if(typeof a.avoidHighways==="boolean"){
    S.avoidHighways=a.avoidHighways; S.avoidTolls=a.avoidHighways; S.pendingRoad=false; S.roadChosen=true;
    if(!S.destination){ botSay(T().needDest); return; }
    botSay(a.avoidHighways ? T().tollAvoid : T().tollUse, false);   // 即時ack（読み上げ）
    buildRoute(()=>botSay(a.avoidHighways ? T().reroutedAvoid : T().reroutedUse));  // 引き直し完了で一言
    return;
  }
  botSay(cannedFor("chat"));
}
// control: start|stop|repeat|mute → 既存操作へ
function controlNav(action){
  if(action==="start") startNav();
  else if(action==="stop") stopNav();
  else if(action==="repeat") repeatStep();
  else if(action==="mute") muteTts();
  else botSay(cannedFor("chat"));
}
// 走行状況をテンプレで読み上げ（数値は routeRemaining の実値のみ。LLMに数値を作らせない）
function speakStatus(){
  const rem=routeRemaining();
  if(!rem){ botSay(T().statusNoRoute); return; }
  botSay(T().statusLine(rem.km, rem.etaMin, S.travelMode==="WALKING"?T().walk:T().drive));
}
// 消音：読み上げをOFFにしてキューも空に（発話で知らせず toast のみ＝静かにする指示に矛盾しない）
function muteTts(){
  S.tts=false; localStorage.setItem("nav_tts","0"); flushTts();
  const b=$("ttsBtn"); if(b){ b.classList.remove("on"); b.textContent="🔇"; }
  toast(T().muted);
}
// remember/recall は M1 ではスタブ（M3で voice-nav コレクションへ接続）
function rememberFact(fact){ fact ? botSay(T().remembered) : botSay(cannedFor("chat")); }
function recallFact(_topic){ botSay(T().recallStub); }

// 音楽リクエストは今回スタブ（Spotify連携は後日）。toast表示＋短い断り。
function playMusicStub(mood){
  toast((S.lang==="ja"?"🎵 音楽（準備中）":"🎵 Music (coming soon)")+(mood?(S.lang==="ja"?"："+mood:": "+mood):""));
  botSay(S.lang==="ja"?"音楽はまだ準備中なんです。":"Music isn't ready yet.");
}
// 任意の地名を経由地として追加（目的地未設定なら目的地にする）
function addWaypointByQuery(query){
  botSay(T().searching(query), false);
  const done=(loc,name)=>{
    if(!S.destination){ setDestinationCandidate(loc, name||query); return; }
    S.waypoints.unshift({loc, name:name||query});
    buildRoute(()=>botSay(T().detourAdd(name||query)));
  };
  if(S.places){
    const req={ query, ...(S.me?{location:S.me, radius:30000}:{}) };
    S.places.textSearch(req,(res,st)=>{
      if(st===google.maps.places.PlacesServiceStatus.OK && res && res[0]) done(res[0].geometry.location, res[0].name);
      else geocodeWaypoint(query, done);
    });
  } else geocodeWaypoint(query, done);
}
function geocodeWaypoint(query, done){
  if(!S.geocoder){ botSay(T().notFound(query)); return; }
  S.geocoder.geocode({address:query},(gr,gs)=>{
    (gs==="OK" && gr && gr[0]) ? done(gr[0].geometry.location, query) : botSay(T().notFound(query));
  });
}
// LLMへ渡す走行コンテキストを状態Sから組み立てる
function buildNavContext(){
  const d=new Date();
  const ctx={ lang: S.lang,   // ← nav-chatはこの言語で応答する（ja/en）
              time: d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"),
              mode: (S.travelMode==="WALKING"?"徒歩":"車"), navOn:S.navOn };
  if(S.townName) ctx.town=S.townName;
  if(S.destName) ctx.dest=S.destName;
  // 数字の唯一の源は ctx.route（実測・full route）に一本化する。remainKm/etaMin（残り区間の和）を
  // 併記すると LLM がそちらの別数字を答え（gen9の"54分"の一因）、guardSay の差し替えとも食い違うため送らない。
  ctx.route=buildRouteState();   // 問題1: 経路の現在状態（実測値）を毎ターン注入し数字の捏造を防ぐ
  // 問題3: bot 発話の数値は伏字化して渡す（過去のETA/所要/距離の再利用を防ぐ）。user はそのまま。
  const recent=S.history.slice(0,-1).slice(-6).map(h=> h.role==="bot" ? {bot:_redactNumbers(h.text)} : {[h.role]:h.text});
  if(recent.length) ctx.recent=recent;
  return ctx;
}
// 問題1: LLMに渡す経路の現在状態。実測(compare)のみ。未計算は computed:false で明示する。
function buildRouteState(){
  const c=S.compare||{};
  const road=(x)=> x ? { km:+(x.dist/1000).toFixed(1), min:durMin(x.dur), eta:etaClock(x.dur) } : null;
  const via=(S.routeIntent&&Array.isArray(S.routeIntent.via))
    ? S.routeIntent.via.map(v=> typeof v==="string"?v:(v&&v.query)||"").filter(Boolean) : [];
  return {
    destName: S.destName||null,
    originName: S.originOverride ? (S.originName||"出発地") : "現在地",
    originIsCurrent: !S.originOverride,
    chosen: S.roadChosen ? (S.avoidHighways?"local":"hwy") : null,
    via,
    computed: !!(c.hwy||c.local),
    hwy: road(c.hwy),
    local: road(c.local)
  };
}
// 所要/時刻/距離の数値を含むか（時刻 21:21・21時21分／◯分／◯km・◯キロ・◯m）。
function _hasNumericClaim(say){
  return /(\d{1,2})[:時]\d{1,2}\s*分?/.test(say) || /\d{1,3}\s*分/.test(say)
      || /\d+(?:\.\d+)?\s*(?:km|キロメートル|キロ|メートル|m)\b/i.test(say);
}
// 会話履歴の bot 発話から数値(時刻/所要/距離)を伏字化して渡す（問題3: 履歴汚染対策）。
// LLM が過去の「49分」等を「提供された値」と誤認して再利用するのを構造的に断つ。
function _redactNumbers(t){
  return String(t||"")
    .replace(/(\d{1,2})[:時]\d{1,2}\s*分?/g,"（時刻）")
    .replace(/\d{1,3}\s*分/g,"（所要）")
    .replace(/\d+(?:\.\d+)?\s*(?:km|キロメートル|キロ|メートル|m)\b/gi,"（距離）");
}
// 問題1(照合): 実測(compare)がある時、sayの所要/時刻が実測とズレていたら true（＋検知ログ）。
// 検出対象は「所要(◯分)」と「時刻(H:MM/H時MM分)」のみ。地名・道路名の数字(3号線/1丁目/首都高6号)は
// 除外される（号/丁目/番地/駅 等は 分 でも : でも 時 でもないため一致しない）。許容誤差: 所要±1分/時刻±2分。
function _etaToMin(s){ const p=String(s).split(":"); return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0); }
function checkSayNumbers(say){
  const c=S.compare;
  if(!say||typeof say!=="string"||!c||!(c.hwy||c.local)) return false;   // 実測が無ければ検証不可
  const actualMin=[c.hwy&&durMin(c.hwy.dur), c.local&&durMin(c.local.dur)].filter(v=>typeof v==="number");
  const actualEta=[c.hwy&&etaClock(c.hwy.dur), c.local&&etaClock(c.local.dur)].filter(Boolean);
  const timeRe=/(\d{1,2})[:時](\d{1,2})\s*分?/g; const etas=[]; let m;
  while((m=timeRe.exec(say))) etas.push(parseInt(m[1],10)+":"+String(parseInt(m[2],10)).padStart(2,"0"));
  const dm=say.replace(timeRe,"").match(/(\d{1,3})\s*分/);   // 時刻表現を除いた「◯分」＝所要
  let mismatch=false;
  if(dm){ const said=parseInt(dm[1],10);
    if(actualMin.length && !actualMin.some(a=>Math.abs(a-said)<=1)){
      console.log("[MulmoNavi SAY] numeric-mismatch", {kind:"min", said, actual:actualMin}); mismatch=true; } }
  for(const e of etas){ const said=_etaToMin(e);
    if(actualEta.length && !actualEta.some(a=>Math.abs(_etaToMin(a)-said)<=2)){
      console.log("[MulmoNavi SAY] numeric-mismatch", {kind:"eta", said:e, actual:actualEta}); mismatch=true; } }
  return mismatch;
}
// 選択中の道種の実測 info を返す（差し替え文言用）。
function _chosenInfo(){ const local=!!S.avoidHighways; return { local, info: local ? (S.compare.local||S.compare.hwy) : (S.compare.hwy||S.compare.local) }; }
// 問題1/2(検知→遮断): sayの数値が実測と食い違えば、汎用文でなく preferredLine と同じ生成で差し替える。
//  - computed:true  … mismatch を検知したら実測の chosen から正しい文言へ差し替え（gen9対策）。
//  - computed:false … 数値を含む say は捏造 → 安全文言へ差し替え。
function guardSay(say, willCompute){
  const computed=!!(S.compare && (S.compare.hwy||S.compare.local));
  if(computed){
    if(checkSayNumbers(say)){
      const {local,info}=_chosenInfo();
      const replaced=preferredLine(info, local);   // 既存の生成ロジックを再利用
      S._sayReplaced=(S._sayReplaced||0)+1;
      console.log("[MulmoNavi SAY] replaced", {said:say, replaced, count:S._sayReplaced});
      return replaced;
    }
    return say;
  }
  if(say && typeof say==="string" && _hasNumericClaim(say)){
    console.log("[MulmoNavi SAY] fabricated-when-uncomputed", {said:say});
    const ja=S.lang==="ja";
    return willCompute ? (ja?"ルートを調べますね。":"Let me look up the route.")
                       : (ja?"まだ経路を計算していません。目的地を教えてください。":"I haven't calculated the route yet. Where to?");
  }
  return say;
}
function routeRemaining(){
  if(!S.steps || !S.steps.length) return null;
  let dist=0, time=0;
  for(let i=Math.max(0,S.curStep); i<S.steps.length; i++){ dist+=S.steps[i].distance.value; time+=S.steps[i].duration.value; }
  return { km:+(dist/1000).toFixed(1), etaMin:Math.round(time/60) };
}
// トークン未受領（ランチャー経由でない/レース）なら、内蔵音声で動作中である旨と
// ランチャーへの導線を画面上部に一度だけ表示する。OpenAI OFF/トークン有りなら出さない。

// 現在地の町名を逆ジオコードでキャッシュ（45秒スロットル）
function maybeUpdateTown(){
  if(!S.geocoder || !S.me) return;
  const now=Date.now();
  if(S.townName && now - S.townAt < 45000) return;
  S.townAt=now;
  S.geocoder.geocode({location:S.me},(gr,gs)=>{
    if(gs==="OK" && gr && gr[0]) S.townName=shortArea(gr[0].formatted_address);
  });
