/* ============================ 目的地検索 ============================ */
// 目的地を確定してルートを引く（テキスト検索・地図クリック 共通）
function setDestinationCandidate(loc, name){
  S.destination = loc;
  S.destName = name || (S.lang==="ja"?"選択した地点":"selected point");
  S.waypoints = [];
  botSay(T().destSet(S.destName));
  // 高速確認は「初回だけ」。ナビ中・既存ルート有・道種決定済みなら、確認を挟まず即リルート
  // （目的地変更が確実に地図へ反映される。確認待ちで固まってルートが変わらない不具合を解消）。
  if(S.travelMode==="DRIVING" && !S.roadChosen && !S.navOn && !S.route){
    S.pendingRoad=true;
    botSay(T().askToll);
  }else{
    console.log("[MulmoNavi] setDest→buildRoute immediately (navOn="+S.navOn+" route="+!!S.route+" roadChosen="+!!S.roadChosen+")");
    buildRoute();
  }
}

// 住所文字列から「都道府県＋市区町村」を抽出（TTS/表示用に短く）
function shortArea(addr){
  if(!addr) return "";
  const a=String(addr).replace(/^日本[、,]?\s*/,"").replace(/〒?\d{3}-?\d{4}\s*/,"");
  const m=a.match(/([^\s、,]+?[都道府県])?\s*([^\s、,0-9０-９]+?[市区町村])/);
  if(m && (m[1]||m[2])) return (m[1]||"")+(m[2]||"");
  return a.split(/[、,]/)[0].slice(0,24);
}
function candLabel(c){ return c.area ? (S.lang==="ja" ? `${c.name}（${c.area}）` : `${c.name} (${c.area})`) : c.name; }

// テキスト/音声クエリ → 候補を出して確認（即ルートは引かない）
function searchDestination(query, opts){
  if(!S.places){toast("Map not ready");return;}
  if(!query){ botSay(T().needDest); return; }
  const confirm = !(opts && opts.confirm===false);
  botSay(T().searching(query), false);
  const req={ query };
  if(S.me){ req.location=S.me; req.radius=30000; }
  S.places.textSearch(req,(res,status)=>{
    if(status===google.maps.places.PlacesServiceStatus.OK && res && res.length){
      const cands=res.slice(0,MAX_CANDIDATES)
        .filter(p=>p.geometry && p.geometry.location)
        .map(p=>({loc:p.geometry.location, name:p.name||query, area:shortArea(p.formatted_address)}));
      if(!cands.length){ botSay(T().notFound(query)); return; }
      if(confirm) presentCandidates(cands);
      else setDestinationCandidate(cands[0].loc, candLabel(cands[0]));
    }else{
      // フォールバック: geocoder（単一候補）
      S.geocoder.geocode({address:query},(gr,gs)=>{
        if(gs==="OK"&&gr[0]){
          const c={loc:gr[0].geometry.location, name:gr[0].formatted_address, area:shortArea(gr[0].formatted_address)};
          if(confirm) presentCandidates([c]);
          else setDestinationCandidate(c.loc, candLabel(c));
        }else{ botSay(T().notFound(query)); }
      });
    }
  });
}

/* ============================ 目的地の確認ステップ ============================ */
function styleCandMarker(mk,i,active){
  mk.setIcon({path:google.maps.SymbolPath.CIRCLE, scale:active?15:11,
    fillColor:active?"#2ee6a6":"#ffb020", fillOpacity:active?1:.85,
    strokeColor:"#04231a", strokeWeight:2});
  mk.setLabel({text:String(i+1), color:"#04231a", fontWeight:"700", fontSize:"12px"});
  mk.setZIndex(active?1000:500);
}
function fitToCandidates(cands){
  if(cands.length<=1){ S.map.panTo(cands[0].loc); if(!S.navOn) S.map.setZoom(15); return; }
  const b=new google.maps.LatLngBounds();
  cands.forEach(c=>b.extend(c.loc));
  if(S.me) b.extend(S.me);
  S.map.fitBounds(b,80);
}
function presentCandidates(cands){
  clearPending();  // 前の確認を破棄
  // 確認（はい／違う）は挟まず、先頭候補をそのまま目的地に設定してルートを引く
  const c=cands[0];
  S.map.panTo(c.loc);
  setDestinationCandidate(c.loc, candLabel(c));
}
function offerCandidate(){
  const p=S.pending; if(!p) return;
  const c=p.cands[p.idx];
  p.markers.forEach((mk,i)=>styleCandMarker(mk,i,i===p.idx));
  S.map.panTo(c.loc);
  const more = p.cands.length>1 ? " "+T().candCount(p.idx+1,p.cands.length) : "";
  botSay(T().confirmDest(candLabel(c))+more);
  startPendingTimeout();
}
function startPendingTimeout(){
  const p=S.pending; if(!p) return;
  clearTimeout(p.timer);
  p.timer=setTimeout(()=>{ botSay(T().confirmTimeout); clearPending(); }, CONFIRM_TIMEOUT_MS);
}
function confirmCandidate(){
  const p=S.pending; if(!p) return;
  const c=p.cands[p.idx];
  clearPending();
  setDestinationCandidate(c.loc, candLabel(c));
}
function nextCandidate(){
  const p=S.pending; if(!p) return;
  if(p.idx < p.cands.length-1){ clearTimeout(p.timer); p.idx++; offerCandidate(); }
  else { botSay(T().noMoreCand); clearPending(); }
}
function clearPending(){
  const p=S.pending; if(!p) return;
  clearTimeout(p.timer);
  p.markers.forEach(mk=>mk.setMap(null));
  S.pending=null;
}
// 高速（有料道路）確認の応答を yes(使う) / no(使わない) / other に分類
function classifyRoad(t){
  const s=(t||"").trim();
  // 明確な「使わない/下道」だけ no。「高速やめて」「高速いや」も no 側に含める。
  if(/(使わ|つかわ|使いません|使わないで|避け|さけ|下道|一般道|下の道|高速(は)?(やめ|やだ|いや|要ら|いら|なし|不要|使わ)|下でいい|一般で|no|nope|avoid|without)/i.test(s)) return "no";
  // 明確な「使う/高速で」だけ yes（短い確認のみ。長い指示は other→LLM に流す）。
  if(/^(はい|うん|ええ|そう(です)?|ok|okay|オッケー?|おっけー?|了解|りょ|お願いします?|おねがい|使う|つかう|使って|使いたい|使います|高速で|高速使|有料でも?|yes|yep|yeah|sure|use)[\s。！!.．]*$/i.test(s)) return "yes";
  return "other";   // 条件変更・別話題・曖昧 → 待ち解除して通常LLM処理へ
}
// 確認待ち中の応答を yes / no / cancel / other に分類
function classifyConfirm(t){
  if(/(やめ|キャンセル|中止|なし|stop|cancel)/i.test(t)) return "cancel";
  if(/(違う|ちがう|いいえ|いや|ちゃう|じゃない|別の?|ほか|他|次|つぎ|もう一[度回]|やり直|no|nope|not)/i.test(t)) return "no";
  if(/(はい|うん|ええ|そう|それで?|ok|okay|オッケー?|おっけー?|了解|りょ|お願い|おねがい|決定|確定|いい[よね]?|正解|yes|yep|yeah|right|correct|sure)/i.test(t)) return "yes";
  return "other";
}

/* 地図クリック：POIを目的地候補にする */
function pickPlaceAsDestination(placeId, latLng){
  if(!S.places){ if(latLng) pickLatLngAsDestination(latLng); return; }
  S.places.getDetails({placeId, fields:["name","geometry","formatted_address"]}, (p,status)=>{
    if(status===google.maps.places.PlacesServiceStatus.OK && p && p.geometry){
      setDestinationCandidate(p.geometry.location, p.name||p.formatted_address);
    }else if(latLng){
      pickLatLngAsDestination(latLng);
    }
  });
}

/* 地図クリック：施設でない地点は逆ジオコードして目的地候補にする */
function pickLatLngAsDestination(latLng){
  if(!S.geocoder){ setDestinationCandidate(latLng, null); return; }
  S.geocoder.geocode({location:latLng},(gr,gs)=>{
    const name=(gs==="OK"&&gr&&gr[0]) ? gr[0].formatted_address
      : `${latLng.lat().toFixed(5)}, ${latLng.lng().toFixed(5)}`;
    setDestinationCandidate(latLng, name);
  });
}

/* ============================ ルート構築 ============================ */
function buildRoute(cb){
  if(!S.destination){ botSay(T().needDest); return; }
  // item4-3: origin = 明示出発地(originOverride) ?? 現在地(S.me) ?? 地図中心。
  // "current" のときは originOverride=null なので現在地が使われる（走行追従は S.me 基準のまま）。
  const originLatLng = S.originOverride || (S.me ? { lat:S.me.lat, lng:S.me.lng } : S.map.getCenter().toJSON());
  // 問題3: reroute判定は「既存ルートの有無」で決める（cbの有無とは分離）。
  const wasReroute = !!S.route;
  // 後勝ち世代ガード: 連続でルート条件を変えると DirectionsService のコールバックが
  // 前後することがある。最新世代(mySeq===S.routeSeq)の結果だけを適用・読み上げし、
  // 追い越された古い結果は破棄する（古いリルートが後から上書きする競合を防ぐ）。
  const mySeq = (S.routeSeq = (S.routeSeq||0) + 1);
  const req={
    origin:originLatLng, destination:S.destination,
    waypoints:S.waypoints.map(w=>({location:w.loc,stopover:true})),
    travelMode:google.maps.TravelMode[S.travelMode],
    avoidTolls:!!S.avoidTolls,
    avoidHighways:!!S.avoidHighways,
    optimizeWaypoints:false
  };
  S.dirService.route(req,(res,status)=>{
    if(mySeq !== S.routeSeq){   // 追い越された古い結果 → 適用も読み上げもしない
      console.log("[MulmoNavi] stale route dropped (seq "+mySeq+" < "+S.routeSeq+")");
      return;
    }
    if(status==="OK"){
      const routes=(res&&res.routes)||[];
      const leg=(routes[0]&&routes[0].legs)||[];
      const totalDist=leg.reduce((a,l)=>a+l.distance.value,0);
      const totalTime=leg.reduce((a,l)=>a+l.duration.value,0);
      // [MAP-DIAG] item2: setDirections 前後のズーム・中心を取得（ビューポートが動いたか確定）
      let zBefore=null, cBefore=null;
      try{ zBefore=S.map.getZoom(); const c=S.map.getCenter(); cBefore=c&&(c.lat().toFixed(5)+","+c.lng().toFixed(5)); }catch(e){}
      let setOk=false, hadMap=null;
      try{ S.dirRenderer.setDirections(res); setOk=true; }catch(e){ console.log("[MulmoNavi ROUTE] setDirections threw:", e && e.message); }
      try{ hadMap = !!(S.dirRenderer.getMap && S.dirRenderer.getMap()); }catch(e){ hadMap="err"; }
      let zAfter=null, cAfter=null;
      try{ zAfter=S.map.getZoom(); const c=S.map.getCenter(); cAfter=c&&(c.lat().toFixed(5)+","+c.lng().toFixed(5)); }catch(e){}
      // [MAP-DIAG] item2: 地図コンテナのサイズ・可視性＋ビューポート移動を最初の1回だけダンプ
      if(!S._routeDiagOnce){
        S._routeDiagOnce=true;
        try{
          const el=$("map"), wrap=$("mapWrap"), cs=getComputedStyle(el);
          console.log("[MulmoNavi MAP] container@setDirections", {
            mapOffsetW:el.offsetWidth, mapOffsetH:el.offsetHeight, isConnected:el.isConnected,
            display:cs.display, visibility:cs.visibility, position:cs.position, zIndex:cs.zIndex,
            wrapOffsetW:wrap?wrap.offsetWidth:null, wrapOffsetH:wrap?wrap.offsetHeight:null,
            zoomBefore:zBefore, zoomAfter:zAfter, centerBefore:cBefore, centerAfter:cAfter,
            viewportMoved:(zBefore!==zAfter)||(cBefore!==cAfter)
          });
        }catch(e){ console.log("[MulmoNavi MAP] container@setDirections err", e&&e.message); }
      }
      // [ROUTE-DIAG] 実機用診断: routes/距離/所要/回避/描画 ＋ 出発地・目的地の実座標（問題2）
      const _ll=(x)=>{ if(!x)return {lat:null,lng:null}; try{ return {lat: typeof x.lat==="function"?x.lat():x.lat, lng: typeof x.lng==="function"?x.lng():x.lng}; }catch(e){ return {lat:"err",lng:"err"}; } };
      const _o=_ll(originLatLng), _d=_ll(S.destination);
      console.log("[MulmoNavi ROUTE] applied", {
        seq:mySeq, status, routes:routes.length, index:0,
        distM:totalDist, timeS:totalTime,
        avoidHighways:!!S.avoidHighways, avoidTolls:!!S.avoidTolls,
        setDirections:setOk, rendererHasMap:hadMap,
        rendererMapIsAppMap: (function(){try{return S.dirRenderer.getMap()===S.map;}catch(e){return "err";}})(),
        navOn:S.navOn, reroute:wasReroute, destName:S.destName,
        originIsCurrent: !S.originOverride, originName: S.originOverride ? (S.originName||null) : "current",
        originLat:_o.lat, originLng:_o.lng, destLat:_d.lat, destLng:_d.lng
      });
      S.route=routes[0];
      S.steps = leg.flatMap(l=>l.steps);
      S.curStep=0; S.lastSpokenStep=-1;
      renderSteps();
      if(cb) cb();
      else botSay(T().routeReady(fmtDist(totalDist), fmtDuration(totalTime)));
    }else{
      console.log("[MulmoNavi ROUTE] FAILED", { seq:mySeq, status });
      botSay(T().noRoute);
    }
  });
}
/* ============================ 所要時間の比較（高速あり/なし 2本）============================
   DSL経路(applyRouteIntent)から呼ぶ。avoidHighways:false/true の2本を『並列』で発行し、
   prefer に一致する方を描画・もう一方は数値保持。渋滞込み(duration_in_traffic)を優先。
   片方失敗でも継続（比較できないが動く）。世代は intentGen + pairSeq の二重ガード。 */
function _legDur(leg){ // 渋滞込み優先・無ければ duration
  let t=0, allTraffic=true;
  for(const l of leg){ if(l.duration_in_traffic && l.duration_in_traffic.value!=null) t+=l.duration_in_traffic.value; else { t+=(l.duration&&l.duration.value)||0; allTraffic=false; } }
  return { dur:t, usedTraffic:allTraffic };
}
function routeInfo(res){
  if(!res||!res.routes||!res.routes[0]) return null;
  const leg=res.routes[0].legs;
  const dist=leg.reduce((a,l)=>a+((l.distance&&l.distance.value)||0),0);
  const d=_legDur(leg);
  return { dist, dur:d.dur, usedTraffic:d.usedTraffic, res };
}
function etaClock(sec){ const dt=new Date(Date.now()+sec*1000); return dt.getHours()+":"+String(dt.getMinutes()).padStart(2,"0"); }
function durMin(sec){ return Math.round(sec/60); }
// 比較アナウンスの唯一の組み立て（初回=buildRoutePair後 / prefer切替=キャッシュ再描画 の両経路で共用）。
// 選択中の道種を必ず先頭に置き「選択側(所要+料金+ETA) + もう一方(所要[+料金])」の形にする。
// 料金はキャッシュ S.compare[side].toll から取得（TOLL再呼び出しはしない）。未取得/無料は料金を省く。
const _roadWord = (local, ja) => ja ? (local?"下道":"高速") : (local?"Local roads":"Highway");
function _cmpTollClause(info, ja){
  const t = info && info.toll;
  if(!t || typeof t.yen!=="number" || t.yen<=0) return "";   // 未取得(—)/無料 は料金を言わない
  return ja ? `${t.approx?"約":""}${t.yen}円` : `${t.approx?"about ":""}${t.yen} yen`;
}
function buildCompareLine(preferLocal){
  const c=S.compare||{}; const ja=S.lang==="ja";
  const chosen = preferLocal ? c.local : c.hwy;
  const other  = preferLocal ? c.hwy   : c.local;
  const parts=[];
  if(chosen){ const tc=_cmpTollClause(chosen, ja);   // 選択側: 所要 + 料金 + ETA
    parts.push(ja ? `${_roadWord(preferLocal,ja)}で${durMin(chosen.dur)}分${tc?`、${tc}`:""}、${etaClock(chosen.dur)}着です。`
                  : `${_roadWord(preferLocal,ja)} ${durMin(chosen.dur)} min${tc?`, ${tc}`:""}, arriving ${etaClock(chosen.dur)}.`); }
  if(other){ const tc=_cmpTollClause(other, ja);      // もう一方: 所要 [+ 料金]（ETAは省く）
    parts.push(ja ? `${_roadWord(!preferLocal,ja)}なら${durMin(other.dur)}分${tc?`、${tc}`:""}です。`
                  : `${_roadWord(!preferLocal,ja)} ${durMin(other.dur)} min${tc?`, ${tc}`:""}.`); }
  return parts.join(ja?"":" ");
}
// item8: 初回アナウンス（buildRoutePair後）。統合関数 buildCompareLine を経由。
function announceCompare(iHwy, iLocal, sayFallback){
  const msg = buildCompareLine(!!S.avoidHighways);
  botSay(msg || sayFallback || T().routeReady(iHwy?fmtDist(iHwy.dist):"", ""), true, {cache:false});
}
// item7: 比較パネル（距離/所要/到着/料金枠）。prefer 側をハイライト。
function updateCompareUI(){
  const el=$("compareBar"); if(!el) return;
  const c=S.compare;
  if(!c || (!c.hwy && !c.local)){ el.style.display="none"; el.innerHTML=""; return; }
  const ja=S.lang==="ja"; const preferLocal=!!S.avoidHighways;
  const row=(label,i,on)=> i ? `<div class="cmp-row${on?' on':''}"><span class="cmp-l">${label}</span>`+
    `<span>${fmtDist(i.dist)}</span><span class="cmp-t">${durMin(i.dur)}${ja?"分":"m"}</span><span>${etaClock(i.dur)}</span><span class="cmp-fee">${fmtToll(i.toll)}</span></div>` : "";
  el.innerHTML = `<div class="cmp-head"><span></span><span>${ja?"距離":"Dist"}</span><span>${ja?"所要":"Time"}</span><span>${ja?"到着":"ETA"}</span><span>${ja?"料金":"Toll"}</span></div>`
    + row(ja?"高速":"Hwy", c.hwy, !preferLocal) + row(ja?"下道":"Local", c.local, preferLocal);
  el.style.display="block";
}
const ROUTE_ONCE_TIMEOUT_MS = 12000;
// 1本を Promise で発行（並列化用）。成功=res, 失敗=null（reject しない）。コールバック不発は
// タイムアウトで null 化し、失敗は [MulmoNavi PAIR] FAILED{which,status,error} を必ずログ。
function _routeOnce(baseReq, avoidHighways, which){
  return new Promise((resolve)=>{
    let done=false; let timer=null;
    const finish=(v)=>{ if(done)return; done=true; if(timer)clearTimeout(timer); resolve(v); };
    timer=setTimeout(()=>{ console.log("[MulmoNavi PAIR] FAILED", { which, status:"TIMEOUT", error:"no callback in "+ROUTE_ONCE_TIMEOUT_MS+"ms" }); finish(null); }, ROUTE_ONCE_TIMEOUT_MS);
    try{
      S.dirService.route(Object.assign({}, baseReq, {avoidHighways}), (res,status)=>{
        if(status==="OK" && res){ finish(res); }
        else { console.log("[MulmoNavi PAIR] FAILED", { which, status:String(status), error:null }); finish(null); }
      });
    }catch(e){ console.log("[MulmoNavi PAIR] FAILED", { which, status:"THROW", error:(e&&e.message)||String(e) }); finish(null); }
  });
}
async function buildRoutePair(intentGen, sayFallback){
  try{
    if(!S.destination){ botSay(T().needDest); return; }
    const originLatLng = S.originOverride || (S.me ? {lat:S.me.lat,lng:S.me.lng} : S.map.getCenter().toJSON());
    const pairSeq = (S.routeSeq = (S.routeSeq||0) + 1);   // item2: ペアで共有する世代番号
    const isDriving = (S.travelMode==="DRIVING");
    const baseReq = {
      origin:originLatLng, destination:S.destination,
      waypoints:S.waypoints.map(w=>({location:w.loc,stopover:true})),
      travelMode:google.maps.TravelMode[S.travelMode],
      avoidTolls:!!S.avoidTolls, optimizeWaypoints:false
    };
    if(isDriving) baseReq.drivingOptions={ departureTime:new Date(), trafficModel:"bestguess" };   // item3
    const t0=performance.now();
    // 徒歩は高速/下道の区別が無いので1本のみ（比較UIは出さない）。各Promiseは reject しない。
    const pair = isDriving ? await Promise.all([ _routeOnce(baseReq,false,"hwy"), _routeOnce(baseReq,true,"local") ])
                           : [ await _routeOnce(baseReq,false,"hwy"), null ];
    const latMs=Math.round(performance.now()-t0);
    // item2: 後着Intent/ペアに追い越されていたら破棄（二重ガード）
    if(intentGen!==S.intentSeq || pairSeq!==S.routeSeq){ console.log("[MulmoNavi PAIR] stale dropped", {intentGen, curIntent:S.intentSeq, pairSeq, curRoute:S.routeSeq}); return; }
    const iHwy=routeInfo(pair[0]), iLocal=routeInfo(pair[1]);
    console.log("[MulmoNavi PAIR] result", { latMs, isDriving,
      hwy: iHwy?{distM:iHwy.dist,durS:iHwy.dur,traffic:iHwy.usedTraffic,src:iHwy.usedTraffic?"duration_in_traffic":"duration"}:null,
      local: iLocal?{distM:iLocal.dist,durS:iLocal.dur,traffic:iLocal.usedTraffic}:null });
    if(!iHwy && !iLocal){ console.log("[MulmoNavi PAIR] both failed"); botSay(sayFallback||T().noRoute); return; }   // item6: 両方失敗のみエラー
    // item5: 描画は prefer.avoidHighways に一致する方（無ければ成功した方）
    const preferLocal=!!S.avoidHighways;
    const chosen = preferLocal ? (iLocal||iHwy) : (iHwy||iLocal);
    const wasReroute = !!S.route;
    let setOk=true; try{ S.dirRenderer.setDirections(chosen.res); }catch(e){ setOk=false; console.log("[MulmoNavi PAIR] setDirections threw", e&&e.message); }
    S.route=chosen.res.routes[0];
    S.steps=S.route.legs.flatMap(l=>l.steps);
    S.curStep=0; S.lastSpokenStep=-1; renderSteps();
    S.compare={ hwy:iHwy, local:iLocal };
    updateCompareUI();
    logRouteApplied(chosen, preferLocal, wasReroute, intentGen, setOk);   // 問題3: 描画側の診断1行
    announceCompare(iHwy, iLocal, sayFallback);   // item8: 片道で両方の数字
    // B-1: 料金・高速区間を Routes API で「後追い」取得（描画・所要比較には割り込ませない）。
    // 従来アナウンス→料金取得完了時に補足発話。失敗しても料金欄が「—」のままになるだけ。
    fetchTollInfo(originLatLng, baseReq, pairSeq, { hwy:iHwy&&iHwy.dist, local:iLocal&&iLocal.dist });
  }catch(e){
    console.log("[MulmoNavi PAIR] FAILED", { which:"pair", status:"THROW", error:(e&&e.message)||String(e) });
    botSay(sayFallback || T().noRoute);   // 沈黙で終わらせない
  }
}

/* ==================== B-1: 料金・高速区間の取得（Routes API併用） ====================
   DirectionsService は車の通行料金を返さない。google.maps.routes.Route.computeRoutes を
   独立に呼び、料金(tollInfo)と高速区間名を取得する。描画(DirectionsRenderer/setDirections)には
   一切触れない＝情報の取得と表示のみ。失敗・遅延しても既存の経路案内/所要比較は無影響。
   ETCパス: 公式 TollPass enum に JP_ETC / JP_ETC2 が存在（Routes API v2）。ETC割引価格を
   採用するため JP_ETC を指定（未指定だと現金価格）。 */
const TOLL_TIMEOUT_MS = 4000;
// JSライブラリ(google.maps.routes.Route)の fields は「トップレベルのプロパティ名のみ」を受け付ける。
// REST版のドット付きパス(travelAdvisory.tollInfo 等)は却下される（実機で確認）。
// 料金は travelAdvisory→route.travelAdvisory.tollInfo / legs→route.legs[i].travelAdvisory.tollInfo、
// 案内文は legs→route.legs[i].steps[j].instructions で読む。公式の料金例と同じ粒度。
const TOLL_FIELDS = ["durationMillis","distanceMeters","travelAdvisory","legs"];
// 経路識別キー（origin/destination/via）。prefer は含めない（両側とも取得しキャッシュするため、
// prefer 切替＝キャッシュ再描画では呼ばない）。
function tollRouteKey(originLatLng){
  const r=x=>x==null?"":(+x).toFixed(4);
  const o = originLatLng ? r(originLatLng.lat)+","+r(originLatLng.lng) : "cur";
  const d = _coord(S.destination); const dest = d.lat!=null ? r(d.lat)+","+r(d.lng) : (S.destName||"");
  const via = (S.waypoints||[]).map(w=>w.name||"").join("|");
  return o+"→"+dest+"|"+via;
}
// Money(estimatedPrice[])の合計を円に。JPYは units（円）＋ nanos/1e9。取得できなければ null。
function tollYenFrom(tollInfo){
  if(!tollInfo) return null;
  const prices = tollInfo.estimatedPrice || tollInfo.estimatedPrices;   // 実装差異に両対応
  if(!Array.isArray(prices) || !prices.length) return 0;               // tollInfo有り価格空＝無料
  let yen=0;
  for(const p of prices){ if(!p) continue; yen += (Number(p.units)||0) + (Number(p.nanos)||0)/1e9; }
  return Math.round(yen);
}
// route全体＋各legのtollInfoから合計円を出す（route.travelAdvisory優先、無ければleg合算）。
function routeTollYen(route){
  const top = tollYenFrom(route && route.travelAdvisory && route.travelAdvisory.tollInfo);
  if(top!=null && top>0) return top;
  let sum=0, seen=false;
  for(const leg of (route&&route.legs)||[]){ const y=tollYenFrom(leg.travelAdvisory&&leg.travelAdvisory.tollInfo); if(y!=null){ sum+=y; seen=true; } }
  if(seen) return sum;
  return top;   // 0 or null
}
// step の指示文（実装差異: navigationInstruction.instructions / instructions）。
function stepInstr(step){
  if(!step) return "";
  const ni=step.navigationInstruction;
  return String((ni&&ni.instructions)||step.instructions||"").trim();
}
// 高速道路名の抽出。連続する有料区間をまとめて「A → B」形式に。取りこぼしは報告参照。
const HWY_RE=/(高速|自動車道|首都高速?|阪神高速|名古屋高速|有料道路|expressway|toll)/i;
// 「首都高速湾岸線」等の路線名を拾う。貪欲(*)にして接尾辞(線/道路/高速等)まで含めた最長名を取る
// （lazy だと『首都高速』で切れる）。区切りは空白・句読点・括弧。
const HWY_NAME_RE=/([^\s。、）)]*(?:高速道路|自動車道|有料道路|バイパス|高速|線))/;
function highwayNames(route){
  const names=[];
  for(const leg of (route&&route.legs)||[]){
    for(const step of leg.steps||[]){
      const t=stepInstr(step); if(!t || !HWY_RE.test(t)) continue;
      const m=t.match(HWY_NAME_RE); const name=(m&&m[1]||"").trim();
      if(name && names[names.length-1]!==name) names.push(name);   // 連続重複はまとめる
    }
  }
  return names;
}
// 1本を computeRoutes で取得（タイムアウト付き・reject しない）。検証用の内訳も返す。
async function computeRouteToll(lib, baseReq, avoidHighways){
  const TollPass = lib.TollPass || {};
  const Extra = lib.ComputeRoutesExtraComputation || {};
  const via = (S.waypoints||[]).map(w=>({ location: w.loc }));
  const tollPassesSent = [ TollPass.JP_ETC || "JP_ETC" ];   // 送信した tollPasses（JP_ETC適用確認材料）
  const req = {
    origin: baseReq.origin, destination: baseReq.destination,
    intermediates: via.length?via:undefined,
    travelMode: baseReq.travelMode,
    routeModifiers: { avoidHighways:!!avoidHighways, avoidTolls:!!S.avoidTolls,
      vehicleInfo:{ emissionType:"GASOLINE" }, tollPasses:tollPassesSent },
    extraComputations: [ Extra.TOLLS || "TOLLS" ],
    fields: TOLL_FIELDS,
  };
  const p = lib.Route.computeRoutes(req);
  const to = new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout "+TOLL_TIMEOUT_MS+"ms")), TOLL_TIMEOUT_MS));
  const { routes } = await Promise.race([p, to]);
  const route = routes && routes[0];
  if(!route) return null;
  const yen = routeTollYen(route);
  const names = highwayNames(route);
  // 検証用: leg ごとの通行料内訳（区間別が取れるか）。
  const legToll = (route.legs||[]).map(l=>tollYenFrom(l.travelAdvisory&&l.travelAdvisory.tollInfo));
  // item2: 取得できなかったフィールドをログで判別できるように（黙って空を検出）。
  const fieldDbg = { durationMillis:route.durationMillis!=null, distanceMeters:route.distanceMeters!=null,
    routeTollInfo: !!(route.travelAdvisory&&route.travelAdvisory.tollInfo),
    legTollInfo: ((route.legs||[]).some(l=>l.travelAdvisory&&l.travelAdvisory.tollInfo)),
    stepInstr: (route.legs||[]).reduce((n,l)=>n+(l.steps||[]).filter(s=>stepInstr(s)).length,0) };
  return { yen, distM: route.distanceMeters, durMs: route.durationMillis, names, legToll, tollPassesSent, fieldDbg };
}
// Directions(既存経路)の steps から高速区間名を抽出（route-compare用）。instructionsはHTML。
function directionsHighwayNames(dirResult){
  const route = dirResult && dirResult.routes && dirResult.routes[0];
  const names=[];
  for(const leg of (route&&route.legs)||[]){
    for(const step of leg.steps||[]){
      const t=stripHtml(step.instructions||""); if(!t || !HWY_RE.test(t)) continue;
      const m=t.match(HWY_NAME_RE); const name=(m&&m[1]||"").trim();
      if(name && names[names.length-1]!==name) names.push(name);
    }
  }
  return names;
}
// 料金・高速区間を後追い取得して比較UI/シート/音声へ反映（本流に割り込まない）。
async function fetchTollInfo(originLatLng, baseReq, gen, dirDist){
  if(S.travelMode!=="DRIVING") return;   // 徒歩は料金対象外
  const key = tollRouteKey(originLatLng);
  if(S._tollKey===key && S._tollResult){ console.log("[MulmoNavi TOLL] cache-hit", { key }); applyTollResult(S._tollResult, gen); return; }
  let lib;
  try{ lib = await google.maps.importLibrary("routes"); if(!lib || !lib.Route) throw new Error("routes library unavailable"); }
  catch(e){ console.log("[MulmoNavi TOLL] FAILED", { status:"IMPORT", error:(e&&e.message)||String(e) }); return; }
  S._tollCalls = (S._tollCalls||0) + 1;
  console.log("[MulmoNavi TOLL] fields-used", TOLL_FIELDS);   // item4: 採用したfields一覧
  console.log("[MulmoNavi TOLL] call #"+S._tollCalls, { key });
  const t0=performance.now();
  let hwy=null, local=null;
  try{ [hwy, local] = await Promise.all([
      computeRouteToll(lib, baseReq, false).catch(e=>{ console.log("[MulmoNavi TOLL] FAILED", { status:"hwy", error:(e&&e.message)||String(e) }); return null; }),
      computeRouteToll(lib, baseReq, true ).catch(e=>{ console.log("[MulmoNavi TOLL] FAILED", { status:"local", error:(e&&e.message)||String(e) }); return null; }),
  ]); }
  catch(e){ console.log("[MulmoNavi TOLL] FAILED", { status:"PAIR", error:(e&&e.message)||String(e) }); return; }
  const latMs=Math.round(performance.now()-t0);
  if(!hwy && !local){ console.log("[MulmoNavi TOLL] FAILED", { status:"EMPTY", error:"no toll route" }); return; }
  const build=(side, dm)=>{ if(!side) return null;
    const gapPct = (dm && side.distM) ? +(Math.abs(side.distM-dm)/dm*100).toFixed(1) : null;
    // item4: 距離乖離5%超は料金を「約」表記に（別経路の可能性）。
    const approx = gapPct!=null && gapPct>5;
    // 検証材料: Routes側の距離・所要、leg別内訳、送信tollPasses（JP_ETC適用確認）も出す。
    console.log("[MulmoNavi TOLL] result", { tollYen:side.yen, distRoutes:side.distM, durRoutesMs:side.durMs,
      distDirections:dm, gapPct, legToll:side.legToll, tollPassesSent:side.tollPassesSent });
    console.log("[MulmoNavi TOLL] fields", side.fieldDbg);
    return { yen:side.yen, approx, names:side.names, gapPct };
  };
  const result = { hwy:build(hwy, dirDist&&dirDist.hwy), local:build(local, dirDist&&dirDist.local), latMs };
  // 経路突き合わせ: Routes API と Directions が同じ高速を通っているか（料金差の原因切り分け）。
  console.log("[MulmoNavi TOLL] route-compare", {
    routesHighways: (hwy&&hwy.names)||[],
    directionsHighways: directionsHighwayNames(S.compare && S.compare.hwy && S.compare.hwy.res) });
  S._tollKey=key; S._tollResult=result;
  console.log("[MulmoNavi TOLL] done", { latMs, calls:S._tollCalls });
  applyTollResult(result, gen);
}
// 取得済み料金を S.compare に貼り、比較UI・シート・補足発話へ反映（gen で後勝ち）。
function applyTollResult(result, gen){
  if(gen!=null && gen!==S.routeSeq){ console.log("[MulmoNavi TOLL] stale (gen)", { gen, cur:S.routeSeq }); return; }
  if(S.compare){ if(S.compare.hwy) S.compare.hwy.toll=result.hwy; if(S.compare.local) S.compare.local.toll=result.local; }
  updateCompareUI();
  updateHwySeg(result);
  announceToll(result);
}
// 高速区間名を #sheet に1行表示（高速側の区間名）。
function updateHwySeg(result){
  const el=$("hwySeg"); if(!el) return;
  const names = (result.hwy && result.hwy.names) || [];
  if(!names.length){ el.style.display="none"; el.innerHTML=""; return; }
  const ja=S.lang==="ja";
  el.innerHTML = `<b>${ja?"高速区間":"Highway"}</b>: `+names.join(" → ");
  el.style.display="block";
}
// 料金の補足発話（従来アナウンス後・取得完了時）。既存 normalizeForSpeech を通す（tts経由）。
function announceToll(result){
  const h=result.hwy, l=result.local;
  const hasH = h && typeof h.yen==="number", hasL = l && typeof l.yen==="number";
  if(!hasH && !hasL) return;
  const ja=S.lang==="ja"; const parts=[];
  if(hasH){ const y=h.yen; parts.push(ja ? (y>0?`高速料金は${h.approx?"約":""}${y}円です。`:`高速も無料です。`)
                                          : (y>0?`Highway toll ${h.approx?"about ":""}${y} yen.`:`Highway is free.`)); }
  if(hasL){ const y=l.yen; if(y>0) parts.push(ja?`下道は${l.approx?"約":""}${y}円です。`:`Local roads ${y} yen.`);
            else parts.push(ja?`下道なら無料です。`:`Local roads are free.`); }
  botSay(parts.join(ja?"":" "), true, { cache:false });
}
// 比較UIの料金セル表記。未取得=「—」、無料=「¥0」、乖離大=「約¥N」。
function fmtToll(toll){
  if(!toll || typeof toll.yen!=="number") return "—";
  const yen = toll.yen.toLocaleString("ja-JP");
  return (toll.approx?"約":"")+"¥"+yen;
}
function fmtDuration(sec){
  const m=Math.round(sec/60);
  if(S.lang==="ja") return m>=60?`${Math.floor(m/60)}時間${m%60}分`:`${m}分`;
  return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`;
}

/* ============================ 寄り道追加 ============================ */
function addDetour(cat){
  const anchor = S.navOn && S.steps[S.curStep] ? S.steps[S.curStep].end_location : (S.me||S.map.getCenter());
  const req={ location:anchor, rankBy:google.maps.places.RankBy.DISTANCE };
  if(cat.type) req.type=cat.type; if(cat.keyword) req.keyword=cat.keyword;
  const label = cat.label[S.lang];
  botSay(T().searching(label), false);
  S.places.nearbySearch(req,(res,status)=>{
    if(status===google.maps.places.PlacesServiceStatus.OK && res && res[0]){
      const p=res[0];
      // 目的地がまだ無ければ、経由地ではなく“目的地”にする
      if(!S.destination){ setDestinationCandidate(p.geometry.location, p.name||label); return; }
      S.waypoints.unshift({loc:p.geometry.location, name:p.name||label});
      buildRoute(()=>{
        botSay(T().detourAdd(p.name||label));
        if(S.navOn){ S.map.panTo(S.me||anchor); }
      });
    }else{
      botSay(T().detourNone(label));
    }
  });
}

/* ============================ ナビ制御 ============================ */
function startNav(){
  if(!S.route && !S.destination){ botSay(T().needDest); return; }
  // item4-3: ナビ開始時は origin を "current" に戻す（現在地からの経路にする）。
  const wasExplicit = !!S.originOverride;
  S.routeIntent.origin="current"; S.originOverride=null; S.originName=null; updateOriginUI();
  console.log("[MulmoNavi ORIGIN] resolved", { name:"current", isCurrent:true, lat:S.me?S.me.lat:null, lng:S.me?S.me.lng:null });
  if(wasExplicit && S.destination){
    // 出発地が明示されていた → 現在地から引き直してからナビ開始
    buildRoute(()=>_startNavLoop());
  }else{
    _startNavLoop();
  }
}
// 実際のナビ開始処理（追従・再計算・到着判定は現在地基準のまま＝従来通り）。
function _startNavLoop(){
  if(!S.route){ botSay(T().needDest); return; }
  S.navOn=true; S.curStep=0; S.lastSpokenStep=-1;
  unlockAudioOnce();           // 「ナビ開始」タップを使って確実に音声を解錠（スマホ対策）
  requestWakeLock();           // 走行中は画面を消さない（スマホを車載時に有効）
  $("banner").classList.add("show");
  S.map.setZoom(18);   // 掃除: setTilt(45) は Maps JS 3.65 で45°イメージ廃止につき削除（警告抑止）
  botSay(T().navStart);
  updateBanner(); speakStep(0, true);
  if(navigator.geolocation){
    S.watchId=navigator.geolocation.watchPosition(onNavPosition,()=>{},
      {enableHighAccuracy:true,timeout:8000,maximumAge:1000});
  }
}
function stopNav(){
  S.navOn=false;
  if(S.watchId!=null){navigator.geolocation.clearWatch(S.watchId);S.watchId=null;}
  releaseWakeLock();
  $("banner").classList.remove("show");
  botSay(T().navStop);
  resetNavState();   // item5: 経路状態を全クリア（次の目的地で高速確認が再度出る＝B-2の副作用解消）
}
// item5: origin/destination/via/prefer/route/roadChosen/pendingRoad をまとめてクリア。
// origin は "current" に戻す（前回の出発地を引き継がない）。stopNav と到着時から呼ぶ。
// フラグ追加時もここに1箇所足すだけでリセット漏れが起きない構造。
function resetNavState(){
  S.routeIntent = { origin:"current", destination:null, via:[], prefer:{avoidHighways:false, avoidTolls:false} };
  S.originOverride=null; S.originName=null;
  S.destination=null; S.destName=""; S.waypoints=[];
  S.avoidHighways=false; S.avoidTolls=false;
  S.route=null; S.roadChosen=false; S.pendingRoad=false;
  if(typeof cancelForget==="function") cancelForget("reset");   // 問題4: 削除確認も破棄
  S.compare=null; if(typeof updateCompareUI==="function") updateCompareUI();   // 比較パネルも消す
  // B-1: 料金キャッシュ・高速区間表示もクリア（次経路で再取得させる）
  S._tollKey=null; S._tollResult=null;
  { const hs=$("hwySeg"); if(hs){ hs.style.display="none"; hs.innerHTML=""; } }
  updateOriginUI();
  if(typeof renderSteps==="function") renderSteps();
  console.log("[MulmoNavi INTENT] resetNavState (cleared)");
}

/* Screen Wake Lock — スマホを車載してナビ中に画面が消えるのを防ぐ。非対応環境や
   拒否時は黙って無視（ナビ機能自体には影響しない）。タブ復帰時に自動で取り直す。 */
let _wakeLock=null;
async function requestWakeLock(){
  try{ if("wakeLock" in navigator){ _wakeLock=await navigator.wakeLock.request("screen");
    _wakeLock.addEventListener?.("release",()=>{ _wakeLock=null; }); } }catch(e){ _wakeLock=null; }
}
function releaseWakeLock(){ try{ _wakeLock?.release?.(); }catch(e){} _wakeLock=null; }
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && S.navOn && !_wakeLock) requestWakeLock();
});
function setMode(mode){
  S.travelMode=mode;
  botSay(T().modeSet(mode==="WALKING"?T().walk:T().drive), false);
  if(S.destination) buildRoute();
}

function onNavPosition(pos){
  updateMe(pos);
  S.map.panTo(S.me);
  if(!S.steps.length) return;
  const here=new google.maps.LatLng(S.me.lat,S.me.lng);
  const step=S.steps[S.curStep];
  if(!step) return;
  const stepEnd=step.end_location;
  const distToEnd=google.maps.geometry.spherical.computeDistanceBetween(here,stepEnd);

  // 到着判定
  const last=S.steps[S.steps.length-1];
  const distToDest=google.maps.geometry.spherical.computeDistanceBetween(here,last.end_location);
  if(distToDest<40){ updateBanner(0,true); botSay(T().arrive); stopNav(); return; }

  // ルート逸脱チェック
  const onPath=isNearRoute(here);
  if(!onPath && S._offCount++>4){ S._offCount=0; S.origin=S.me; botSay(T().reroute); buildRoute(()=>{S.curStep=0;S.lastSpokenStep=-1;updateBanner();}); return; }
  if(onPath) S._offCount=0;

  // 事前アナウンス（150m手前）
  if(distToEnd<160 && S.lastSpokenStep!==S.curStep){ speakStep(S.curStep,false); S.lastSpokenStep=S.curStep; }

  // ステップ前進
  if(distToEnd<25 && S.curStep<S.steps.length-1){
    S.curStep++; S.lastSpokenStep=-1; renderSteps(); speakStep(S.curStep,true);
  }
  updateBanner(distToEnd);
}
S._offCount=0;
function isNearRoute(latlng){
  if(!S.route||!S.route.overview_path) return true;
  const path=S.route.overview_path;
  let min=1e9;
  for(let i=0;i<path.length;i++){
    const d=google.maps.geometry.spherical.computeDistanceBetween(latlng,path[i]);
    if(d<min)min=d; if(min<45)return true;
  }
  return min<60;
}

/* ============================ 案内文・バナー ============================ */
function maneuverIcon(man){
  const map={
    "turn-left":"↰","turn-right":"↱","turn-slight-left":"↖","turn-slight-right":"↗",
    "turn-sharp-left":"⬅","turn-sharp-right":"➡","uturn-left":"↩","uturn-right":"↪",
    "roundabout-left":"↺","roundabout-right":"↻","merge":"⤵","fork-left":"↖","fork-right":"↗",
    "straight":"↑","ramp-left":"↖","ramp-right":"↗","keep-left":"↖","keep-right":"↗"
  };
  return map[man]||"↑";
}
function stepText(step){ return stripHtml(step.instructions||""); }
function updateBanner(distToEnd,arrived){
  const step=S.steps[S.curStep]; if(!step)return;
  $("bMan").textContent = arrived?"🏁":maneuverIcon(step.maneuver);
  $("bMain").textContent = arrived? T().arriveDest : stepText(step);
  const next=S.steps[S.curStep+1];
  $("bSub").textContent = next? "→ "+stepText(next) : "";
  const d = arrived?0:(distToEnd!=null?distToEnd:step.distance.value);
  $("bDist").textContent = fmtDist(d);
  // 残り時間概算
  let remain=0; for(let i=S.curStep;i<S.steps.length;i++) remain+=S.steps[i].duration.value;
  $("bEta").textContent = fmtDuration(remain);
}
function speakStep(i, immediate){
  const step=S.steps[i]; if(!step)return;
  const man=stepText(step);
  const m=step.distance.value;
  let phrase;
  if(immediate){ phrase = T().thenMeters(man); }
  else { phrase = T().inMeters(Math.round(m/10)*10, man); }
  tts(phrase);
}
function repeatStep(){
  const step=S.steps[S.curStep];
  if(!step){ botSay(T().needDest); return; }
  botSay(T().curStep(fmtDist(step.distance.value), stepText(step)));
}

/* ============================ ステップ一覧描画 ============================ */
function renderSteps(){
  const box=$("steps");
  if(!S.steps.length){box.classList.remove("show");box.innerHTML="";return;}
  box.classList.add("show");
  box.innerHTML="";
  S.steps.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className="step"+(i===S.curStep&&S.navOn?" active":"");
    el.innerHTML=`<span class="mi">${maneuverIcon(s.maneuver)}</span>
      <div><div>${stepText(s)}</div><div class="d">${fmtDist(s.distance.value)}</div></div>`;
    box.appendChild(el);
  });
  const active=box.querySelector(".step.active"); if(active) active.scrollIntoView({block:"nearest"});
}

/* OpenAI TTS 設定（モデル＋言語別ボイス）。再読込不要で即反映＋localStorage永続化 */
const OPENAI_VOICES = ["alloy","echo","fable","onyx","nova","shimmer","coral","sage","ash"]; // 全9ボイス
const OPENAI_MODELS = ["gpt-4o-mini-tts","tts-1-hd"]; // 既定=gpt-4o-mini-tts（日本語指示対応）
function populateModelSelect(){
  const sel=$("ttsModelSelect"); if(!sel) return;
  sel.innerHTML = OPENAI_MODELS.map(m=>`<option value="${m}"${m===S.ttsModel?" selected":""}>${m}</option>`).join("");
}
function populateOpenaiVoiceSelect(){
  const sel=$("openaiVoiceSelect"); if(!sel) return;
  const cur=curVoice();
  const label=S.lang==="ja"?"（日本語用）":"（English）";
  sel.innerHTML = OPENAI_VOICES.map(v=>`<option value="${v}"${v===cur?" selected":""}>${v}${v===cur?" ✓":""}</option>`).join("");

  S.openaiTts=$("openaiTtsToggle").checked;

async function previewOpenai(){
  if(!S.ttsToken || !S.ttsUrl){ toast(S.lang==="ja"?"OpenAI未接続：内蔵音声で試聴":"OpenAI not connected: using built-in"); webSpeak(T().voiceSample); return; }

  catch(e){ toast(S.lang==="ja"?"生成失敗：内蔵音声で試聴":"failed: using built-in"); webSpeak(T().voiceSample); }
}
