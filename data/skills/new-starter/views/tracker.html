<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #ffffff;
        --line: #e5e8f0;
        --ink: #1e2537;
        --muted: #6b7385;
        --brand: #4f46e5;
        --brand-soft: #eef2ff;
        --green: #16a34a;
        --green-soft: #dcfce7;
        --amber: #d97706;
        --amber-soft: #fef3c7;
        --gray: #64748b;
        --gray-soft: #eef1f6;
        --slate: #475569;
      }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        padding: 18px;
      }
      h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
      .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .topbar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
        justify-content: space-between; margin-bottom: 16px;
      }
      .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      select, button {
        font: inherit; border: 1px solid var(--line); background: var(--card);
        color: var(--ink); border-radius: 8px; padding: 7px 10px; cursor: pointer;
      }
      select:focus { outline: 2px solid var(--brand-soft); }
      button.primary { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; }
      button.primary:hover { filter: brightness(1.06); }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
      .card .k { font-size: 12px; color: var(--muted); }
      .card .v { font-size: 26px; font-weight: 700; margin-top: 2px; }
      .card .v small { font-size: 14px; color: var(--muted); font-weight: 500; }
      .bar { height: 8px; background: var(--gray-soft); border-radius: 999px; overflow: hidden; margin-top: 8px; }
      .bar > span { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .3s; }
      .phasegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
      .phasebox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); }
      .phasebox .name { font-size: 12px; font-weight: 600; }
      .phasebox .pct { font-size: 12px; color: var(--muted); float: right; }

      .section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
      .section > h2 { font-size: 13px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fbfbfe; color: var(--slate); }

      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--line); vertical-align: middle; }
      th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: none; background: #fbfbfe; }
      tr:last-child td { border-bottom: none; }
      .owner-td { font-weight: 600; }
      .mini { font-size: 11px; color: var(--muted); }

      .phasehdr td { background: #f2f3fb; font-weight: 700; color: var(--brand); font-size: 13px; }
      .cathdr td { background: #fafbff; font-weight: 600; color: var(--slate); font-size: 11px; letter-spacing: .02em; }
      .taskrow:hover { background: #fafbff; }
      .taskname { font-weight: 500; }
      .taskname.done { color: var(--muted); text-decoration: line-through; }
      .detailtxt { font-size: 11px; color: var(--muted); margin-top: 2px; }

      .chk { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; }
      .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; }
      .st-未着手 { background: var(--gray-soft); color: var(--gray); }
      .st-対応中 { background: var(--amber-soft); color: var(--amber); }
      .st-完了 { background: var(--green-soft); color: var(--green); }
      .st-保留 { background: #f1f5f9; color: var(--slate); }
      select.stsel { padding: 4px 6px; font-size: 12px; border-radius: 6px; }

      .inp { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 12px; color: var(--ink); }
      .inp:hover { border-color: var(--line); }
      .inp:focus { outline: none; border-color: var(--brand); background: #fff; }
      td.duedate { white-space: nowrap; font-size: 12px; }
      .overdue { color: #dc2626; font-weight: 600; }

      /* --- S3: diff badges / expander / timeline / actor --- */
      .actorbox { display: flex; align-items: center; gap: 6px; }
      .actorbox input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; width: 130px; }
      .tasktop { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .exp { border: none; background: transparent; cursor: pointer; color: var(--muted); font-size: 12px; padding: 0 2px; width: 16px; line-height: 1; }
      .exp:hover { color: var(--brand); }
      .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
      .badge-same { background: var(--gray-soft); color: var(--gray); }
      .badge-mod  { background: var(--amber-soft); color: var(--amber); }
      .badge-add  { background: #e0edff; color: #1d4ed8; }
      .badge-skip { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
      .detailrow > td { background: #fafbff; padding: 10px 16px 14px; }
      .detailrow.hidden { display: none; }
      .ovtoggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--slate); margin-bottom: 10px; cursor: pointer; }
      .ovtoggle input { width: 15px; height: 15px; accent-color: var(--amber); }
      .tl { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
      .tl li { position: relative; padding: 4px 0 4px 14px; font-size: 12px; color: var(--ink); }
      .tl li::before { content: ""; position: absolute; left: -5px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
      .tl .when { color: var(--muted); font-size: 11px; margin-right: 6px; }
      .tl .fld { font-weight: 600; }
      .tl .arrow { color: var(--muted); }
      .tl-empty { font-size: 12px; color: var(--muted); }

      .empty { padding: 40px; text-align: center; color: var(--muted); }
      .err { color: #b91c1c; padding: 14px; }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); align-items: center; }
      @media (max-width: 680px) {
        td .mini, .detailtxt { display: none; }
        th.hide-sm, td.hide-sm { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div>
        <h1>🎒 New Starter — Action Tracker</h1>
        <div class="sub">誰の・どのタスクが・どこまで進んでいるかを一目で。チェックで完了、メモはその場で編集できます。</div>
      </div>
      <div class="controls">
        <div class="actorbox"><label class="mini">操作者:</label><input id="actorInput" value="Office Manager" title="履歴に記録する操作者名" /></div>
        <label class="mini">対象:</label>
        <select id="starterSel"></select>
        <button class="primary" id="addBtn">＋ 新入社員を追加</button>
      </div>
    </div>

    <div id="root"><div class="empty">読み込み中…</div></div>

    <script>
      const { token, dataUrl } = window.__MC_VIEW;
      const FIELDS = "starter,startDate,phase,category,task,detail,owner,requestTo,status,dueDate,memo,templateTaskId,overridden,templateSyncState,history";
      const PHASES = ["入社前", "初日", "最初の1週間〜1ヶ月"];
      const CATS = ["アカウント・IT関係", "物品", "事務手続き", "初日オリエン", "研修・フォロー"];
      const STATUSES = ["未着手", "対応中", "完了", "保留・N/A"];
      const HIST_FIELDS = { status: "状態", owner: "担当", dueDate: "期限", template: "テンプレ改訂" };
      const DONE = new Set(["完了", "保留・N/A"]);
      const TODAY = new Date().toISOString().slice(0, 10);
      let ALL = [];
      let current = "__all__";
      let ACTOR = "Office Manager";
      const expanded = new Set(); // ids whose timeline is open (persist across re-render)

      // diff badge: テンプレ由来なし=追加 / overridden=変更 / それ以外=テンプレ通り
      function diffBadge(r) {
        if (!r.templateTaskId) return { label: "追加", cls: "badge-add" };
        if (r.overridden) return { label: "変更", cls: "badge-mod" };
        return { label: "テンプレ通り", cls: "badge-same" };
      }
      function badgeCounts(rows) {
        const c = { same: 0, mod: 0, add: 0 };
        for (const r of rows) {
          const b = diffBadge(r);
          if (b.cls === "badge-add") c.add++;
          else if (b.cls === "badge-mod") c.mod++;
          else c.same++;
        }
        return c;
      }

      function timelineHtml(r) {
        const h = (r.history || []).slice();
        if (!h.length) return '<div class="tl-empty">変更履歴なし</div>';
        h.sort((a, b) => String(b.at || "").localeCompare(String(a.at || ""))); // newest first
        const li = h
          .map((e) => {
            const when = (e.at || "").replace("T", " ");
            const fld = HIST_FIELDS[e.field] || e.field || "";
            const from = e.from == null || e.from === "" ? "（空）" : e.from;
            const to = e.to == null || e.to === "" ? "（空）" : e.to;
            return (
              "<li><span class=\"when\">" + esc(when) + "</span>" +
              '<span class="fld">' + esc(fld) + "</span>: " +
              esc(from) + ' <span class="arrow">→</span> ' + esc(to) +
              (e.actor ? ' <span class="when">（' + esc(e.actor) + "）</span>" : "") +
              "</li>"
            );
          })
          .join("");
        return '<ul class="tl">' + li + "</ul>";
      }

      const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const stClass = (s) => (s === "保留・N/A" ? "st-保留" : "st-" + s);

      async function load() {
        const url = dataUrl + "?fields=" + encodeURIComponent(FIELDS);
        const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
        if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text()));
        ALL = (await res.json()).items || [];
      }

      async function save(id, patch) {
        const res = await fetch(dataUrl, {
          method: "PUT",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: JSON.stringify({ items: [{ id, ...patch }], mode: "merge" }),
        });
        if (!res.ok) { alert("保存に失敗しました: " + res.status); return; }
        const { rejected } = await res.json();
        if (rejected && rejected.length) alert("保存できませんでした: " + (rejected[0].problem || "unknown"));
        // local update so UI reflects immediately before onChange re-fetch
        const rec = ALL.find((r) => r.id === id);
        if (rec) Object.assign(rec, patch);
      }

      const norm = (v) => (v == null ? "" : String(v));

      // Commit a tracked field (status/owner/dueDate). Records history ONLY when the
      // value actually changed; returns true if a write happened.
      async function commitTracked(id, field, value) {
        const rec = ALL.find((r) => r.id === id);
        if (!rec) return false;
        if (norm(rec[field]) === norm(value)) return false; // no diff → no write, no history
        const entry = {
          at: new Date().toISOString().slice(0, 16),
          actor: ACTOR || "",
          field,
          from: norm(rec[field]),
          to: norm(value),
        };
        const history = (rec.history || []).concat([entry]);
        await save(id, { [field]: value, history });
        return true;
      }

      function starters() {
        const names = [...new Set(ALL.map((r) => r.starter).filter(Boolean))];
        names.sort((a, b) => a.localeCompare(b, "ja"));
        return names;
      }

      function rowsFor() {
        return current === "__all__" ? ALL : ALL.filter((r) => r.starter === current);
      }

      function pct(rows) {
        if (!rows.length) return 0;
        return Math.round((rows.filter((r) => DONE.has(r.status)).length / rows.length) * 100);
      }

      function renderStarterSelect() {
        const sel = document.getElementById("starterSel");
        const names = starters();
        if (!names.includes(current) && current !== "__all__") current = "__all__";
        sel.innerHTML =
          '<option value="__all__">全員（' + names.length + "名)</option>" +
          names.map((n) => '<option value="' + esc(n) + '"' + (n === current ? " selected" : "") + ">" + esc(n) + "</option>").join("");
        sel.value = current;
      }

      function summaryCards(rows) {
        const total = rows.length;
        const done = rows.filter((r) => DONE.has(r.status)).length;
        const doing = rows.filter((r) => r.status === "対応中").length;
        const overdue = rows.filter((r) => r.dueDate && r.dueDate < TODAY && !DONE.has(r.status)).length;
        const overall = pct(rows);
        const bc = badgeCounts(rows);
        const phaseBoxes = PHASES.map((p) => {
          const pr = rows.filter((r) => r.phase === p);
          const pp = pct(pr);
          return (
            '<div class="phasebox"><span class="pct">' + pp + "%</span><div class=\"name\">" + esc(p) + "</div>" +
            '<div class="mini">' + pr.filter((r) => DONE.has(r.status)).length + "/" + pr.length + " 完了</div>" +
            '<div class="bar"><span style="width:' + pp + '%"></span></div></div>'
          );
        }).join("");
        return (
          '<div class="cards">' +
          '<div class="card"><div class="k">全体進捗</div><div class="v">' + overall + '<small>%</small></div>' +
          '<div class="bar"><span style="width:' + overall + '%"></span></div></div>' +
          '<div class="card"><div class="k">完了 / 全タスク</div><div class="v">' + done + ' <small>/ ' + total + '</small></div>' +
          '<div class="mini" style="margin-top:6px">対応中 ' + doing + ' 件</div></div>' +
          '<div class="card"><div class="k">期限超過（未完了）</div><div class="v" style="color:' + (overdue ? "#dc2626" : "var(--green)") + '">' + overdue + '<small> 件</small></div>' +
          '<div class="mini" style="margin-top:6px">' + (overdue ? "要フォロー" : "遅延なし") + '</div></div>' +
          '<div class="card"><div class="k">テンプレ差分</div>' +
          '<div style="margin-top:6px"><span class="badge badge-same">テンプレ通り ' + bc.same + '</span> ' +
          '<span class="badge badge-mod">変更 ' + bc.mod + '</span> ' +
          '<span class="badge badge-add">追加 ' + bc.add + '</span></div></div>' +
          "</div>" +
          '<div class="section"><h2>フェーズ別の進捗</h2><div style="padding:12px"><div class="phasegrid">' + phaseBoxes + "</div></div></div>"
        );
      }

      function ownerTable(rows) {
        const map = new Map();
        for (const r of rows) {
          const key = r.owner && r.owner.trim() ? r.owner.trim() : "（未割当）";
          if (!map.has(key)) map.set(key, { total: 0, done: 0, doing: 0, todo: 0 });
          const o = map.get(key);
          o.total++;
          if (DONE.has(r.status)) o.done++;
          else if (r.status === "対応中") o.doing++;
          else o.todo++;
        }
        const entries = [...map.entries()].sort((a, b) => b[1].todo - a[1].todo || b[1].total - a[1].total);
        if (!entries.length) return "";
        const body = entries
          .map(([name, o]) => {
            const p = o.total ? Math.round((o.done / o.total) * 100) : 0;
            return (
              "<tr><td class=\"owner-td\">" + esc(name) + "</td>" +
              "<td>" + o.total + "</td>" +
              '<td><span class="pill st-完了">' + o.done + "</span></td>" +
              '<td><span class="pill st-対応中">' + o.doing + "</span></td>" +
              '<td><span class="pill st-未着手">' + o.todo + "</span></td>" +
              '<td style="min-width:120px"><div class="bar"><span style="width:' + p + '%"></span></div><div class="mini">' + p + "%</div></td></tr>"
            );
          })
          .join("");
        return (
          '<div class="section"><h2>担当者別の負荷（Action Tracker）</h2>' +
          "<table><thead><tr><th>担当者</th><th>担当数</th><th>完了</th><th>対応中</th><th>未着手</th><th>進捗</th></tr></thead>" +
          "<tbody>" + body + "</tbody></table></div>"
        );
      }

      function taskTable(rows) {
        if (!rows.length) return '<div class="section"><div class="empty">タスクがありません。「＋ 新入社員を追加」から作成できます。</div></div>';
        const showStarter = current === "__all__";
        let html =
          '<div class="section"><h2>タスク一覧（チェックで完了・メモはクリックで編集）</h2><table><thead><tr>' +
          '<th style="width:34px"></th>' +
          (showStarter ? "<th>新入社員</th>" : "") +
          "<th>タスク</th><th class=\"hide-sm\">担当</th><th class=\"hide-sm\">依頼先</th><th>状態</th><th class=\"duedate\">期限</th><th>メモ</th>" +
          "</tr></thead><tbody>";

        for (const phase of PHASES) {
          const pr = rows.filter((r) => r.phase === phase);
          if (!pr.length) continue;
          const colspan = showStarter ? 8 : 7;
          html += '<tr class="phasehdr"><td colspan="' + colspan + '">' + esc(phase) + "　<span class='mini'>（" + pct(pr) + "%）</span></td></tr>";
          const cats = CATS.filter((c) => pr.some((r) => r.category === c));
          const uncatted = pr.filter((r) => !r.category || !CATS.includes(r.category));
          const groups = cats.map((c) => [c, pr.filter((r) => r.category === c)]);
          if (uncatted.length) groups.push(["その他", uncatted]);
          for (const [cat, crows] of groups) {
            if (groups.length > 1 || cat !== "その他") html += '<tr class="cathdr"><td colspan="' + colspan + '">' + esc(cat) + "</td></tr>";
            for (const r of crows) {
              const isDone = DONE.has(r.status);
              const overdue = r.dueDate && r.dueDate < TODAY && !isDone;
              const bdg = diffBadge(r);
              const skip = r.templateSyncState === "保護によりスキップ";
              const isOpen = expanded.has(r.id);
              const nHist = (r.history || []).length;
              html +=
                '<tr class="taskrow" data-id="' + esc(r.id) + '">' +
                '<td><input type="checkbox" class="chk" data-act="toggle" ' + (isDone ? "checked" : "") + " /></td>" +
                (showStarter ? "<td class=\"mini\">" + esc(r.starter) + "</td>" : "") +
                '<td><div class="tasktop">' +
                '<button class="exp" data-act="exp" title="変更履歴">' + (isOpen ? "▾" : "▸") + "</button>" +
                '<span class="taskname' + (isDone ? " done" : "") + '">' + esc(r.task) + "</span>" +
                '<span class="badge ' + bdg.cls + '">' + bdg.label + "</span>" +
                (skip ? '<span class="badge badge-skip">改訂未反映(保護)</span>' : "") +
                (nHist ? '<span class="mini">🕘' + nHist + "</span>" : "") +
                "</div>" +
                (r.detail ? '<div class="detailtxt">' + esc(r.detail) + "</div>" : "") + "</td>" +
                '<td class="hide-sm"><input class="inp" data-act="owner" value="' + esc(r.owner) + '" placeholder="—" /></td>' +
                '<td class="hide-sm mini">' + esc(r.requestTo) + "</td>" +
                '<td><select class="stsel" data-act="status">' +
                STATUSES.map((s) => '<option' + (s === r.status ? " selected" : "") + ">" + esc(s) + "</option>").join("") +
                "</select></td>" +
                '<td class="duedate ' + (overdue ? "overdue" : "") + '"><input class="inp" type="date" data-act="due" value="' + esc(r.dueDate) + '" /></td>' +
                '<td><input class="inp" data-act="memo" value="' + esc(r.memo) + '" placeholder="メモ…" /></td>' +
                "</tr>" +
                '<tr class="detailrow' + (isOpen ? "" : " hidden") + '" data-detail="' + esc(r.id) + '">' +
                '<td colspan="' + colspan + '">' +
                '<label class="ovtoggle"><input type="checkbox" data-act="override" ' + (r.overridden ? "checked" : "") + " />" +
                "テンプレから変更（保護／テンプレ改訂の反映対象外にする）</label>" +
                timelineHtml(r) +
                "</td></tr>";
            }
          }
        }
        html += "</tbody></table></div>";
        return html;
      }

      function render() {
        renderStarterSelect();
        const rows = rowsFor();
        const root = document.getElementById("root");
        root.innerHTML = summaryCards(rows) + ownerTable(rows) + taskTable(rows);
        wire(root);
      }

      function wire(root) {
        root.querySelectorAll(".taskrow").forEach((tr) => {
          const id = tr.getAttribute("data-id");
          // status via checkbox / dropdown → tracked (history)
          const chk = tr.querySelector('[data-act="toggle"]');
          if (chk) chk.addEventListener("change", () => commitTracked(id, "status", chk.checked ? "完了" : "未着手").then(render));
          const st = tr.querySelector('[data-act="status"]');
          if (st) st.addEventListener("change", () => commitTracked(id, "status", st.value).then(render));
          // owner / dueDate → tracked (history only if changed, on blur/change)
          const ow = tr.querySelector('[data-act="owner"]');
          if (ow) ow.addEventListener("change", () => commitTracked(id, "owner", ow.value).then(render));
          const du = tr.querySelector('[data-act="due"]');
          if (du) du.addEventListener("change", () => commitTracked(id, "dueDate", du.value).then(render));
          // memo → NOT tracked (no history), just persist
          const mm = tr.querySelector('[data-act="memo"]');
          if (mm) mm.addEventListener("change", () => save(id, { memo: mm.value }));
          // expander → toggle timeline
          const ex = tr.querySelector('[data-act="exp"]');
          if (ex)
            ex.addEventListener("click", () => {
              if (expanded.has(id)) expanded.delete(id);
              else expanded.add(id);
              const dr = root.querySelector('.detailrow[data-detail="' + CSS.escape(id) + '"]');
              if (dr) dr.classList.toggle("hidden");
              ex.textContent = expanded.has(id) ? "▾" : "▸";
            });
        });
        // override toggle lives on the detail row
        root.querySelectorAll('.detailrow [data-act="override"]').forEach((cb) => {
          const id = cb.closest(".detailrow").getAttribute("data-detail");
          cb.addEventListener("change", () => save(id, { overridden: cb.checked }).then(render));
        });
      }

      const actorEl = document.getElementById("actorInput");
      ACTOR = actorEl.value.trim() || "Office Manager";
      actorEl.addEventListener("change", () => {
        ACTOR = actorEl.value.trim() || "Office Manager";
      });

      document.getElementById("starterSel").addEventListener("change", (e) => {
        current = e.target.value;
        render();
      });

      document.getElementById("addBtn").addEventListener("click", () => {
        window.__MC_VIEW.startChat(
          "new-starter コレクションに新しい新入社員のオンボーディングタスク一式を追加してください。\n" +
          "SKILL.md の標準タスクテンプレート（19タスク）を使い、starter を新しい氏名に差し替えて、\n" +
          "id は <氏名ローマ字スラッグ>-01〜-19、status は全て「未着手」で manageCollection putItems（mode: create）で作成してください。\n\n" +
          "新入社員の氏名: （ここに入力）\n入社日: （YYYY-MM-DD）"
        );
      });

      load()
        .then(render)
        .catch((e) => {
          document.getElementById("root").innerHTML = '<div class="err">読み込みに失敗しました: ' + esc(e.message) + "</div>";
        });
      window.__MC_VIEW.onChange(() => load().then(render).catch(() => {}));
    </script>
  </body>
</html>
