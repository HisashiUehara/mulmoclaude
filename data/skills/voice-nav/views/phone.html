<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{ --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e7ecf3; --muted:#93a0b4; --accent:#4c8dff; --accent2:#2ee6a6; }
  *{box-sizing:border-box}
  body{ font-family:system-ui,-apple-system,sans-serif; margin:0;
    background:var(--bg); color:var(--txt);
    padding:14px 14px calc(18px + env(safe-area-inset-bottom));
    padding-top:calc(10px + env(safe-area-inset-top)); }
  header{ display:flex; align-items:center; gap:10px; margin:2px 2px 14px; }
  header .dot{ width:11px;height:11px;border-radius:50%;background:var(--accent2);
    box-shadow:0 0 10px var(--accent2) }
  header h1{ font-size:19px; margin:0; letter-spacing:.02em }
  header .sub{ font-size:12px; color:var(--muted); margin:2px 0 0 }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:14px; margin-bottom:14px }
  label.lbl{ display:block; font-size:12.5px; color:var(--muted); margin:0 2px 7px }
  .row{ display:flex; gap:8px }
  input[type=text]{ flex:1; min-width:0; background:var(--panel2);
    border:1px solid var(--line); color:var(--txt); border-radius:12px;
    padding:13px 14px; font-size:16px; outline:none }
  input[type=text]:focus{ border-color:var(--accent) }
  .go{ flex:0 0 auto; border:0; border-radius:12px; background:var(--accent2);
    color:#04231a; font-weight:800; font-size:15px; padding:0 16px; min-height:48px; cursor:pointer }
  .go:active{ transform:scale(.97) }
  .modes{ display:flex; gap:8px; margin-top:10px }
  .mode{ flex:1; text-align:center; border:1px solid var(--line); background:var(--panel2);
    color:var(--muted); border-radius:999px; padding:10px 0; font-size:14px; cursor:pointer;
    min-height:44px; user-select:none }
  .mode.on{ border-color:var(--accent); color:#fff; background:rgba(76,141,255,.18) }
  h2{ font-size:13px; color:var(--muted); font-weight:600; margin:2px 4px 10px;
    text-transform:none; letter-spacing:.03em }
  .card{ display:flex; align-items:center; gap:12px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:10px;
    text-decoration:none; color:inherit; min-height:44px }
  .card:active{ background:var(--panel2) }
  .card .ico{ width:40px;height:40px;flex:0 0 auto;border-radius:11px;background:var(--panel2);
    display:grid;place-items:center;font-size:19px }
  .card .body{ flex:1; min-width:0 }
  .card .name{ font-size:15.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .card .meta{ font-size:12px; color:var(--muted); margin-top:3px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis }
  .card .chev{ flex:0 0 auto; color:var(--accent2); font-size:16px; font-weight:800 }
  .empty{ color:var(--muted); font-size:13.5px; line-height:1.6; text-align:center; padding:14px 6px }
  .add{ width:100%; border:1px dashed var(--line); background:transparent; color:var(--muted);
    border-radius:12px; padding:13px; font-size:14px; min-height:48px; cursor:pointer; margin-top:2px }
  .add:active{ background:var(--panel2) }
  .more{ width:100%; border:0; border-radius:12px; background:var(--accent); color:#fff;
    font-size:15px; font-weight:600; padding:13px; min-height:48px; cursor:pointer; margin-top:2px }
  .err{ color:#ff8095; font-size:13px; padding:10px 4px }
  .hint{ font-size:11.5px; color:var(--muted); margin:10px 4px 0; line-height:1.55 }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <div>
      <h1>MulmoNavi</h1>
      <div class="sub">行き先を入力・選択するとGoogleマップで案内します</div>
    </div>
  </header>

  <div class="panel">
    <label class="lbl" for="dest">行き先</label>
    <div class="row">
      <input type="text" id="dest" placeholder="行き先を入力" autocomplete="off" enterkeyhint="go" />
      <button class="go" id="goBtn">🧭 案内</button>
    </div>
    <div class="modes">
      <div class="mode on" data-mode="driving">🚗 車</div>
      <div class="mode" data-mode="walking">🚶 徒歩</div>
    </div>
  </div>

  <h2>保存した行き先</h2>
  <div id="list"></div>
  <button class="more" id="more" hidden>もっと見る</button>
  <button class="add" id="addBtn">＋ 行き先を保存する</button>

  <div class="hint">タップするとスマホのGoogleマップが開き、現在地からの経路案内が始まります。</div>

<script>
  var V = window.__MC_VIEW;
  var FIELDS = ["name","query","category","mode","area"];
  var PAGE = 50, loaded = [], total = 0, mode = "driving";

  function mapsUrl(dest, travel){
    return "https://www.google.com/maps/dir/?api=1"
      + "&destination=" + encodeURIComponent(dest)
      + "&travelmode=" + (travel || mode);
  }
  function openNav(dest, travel){
    if(!dest) return;
    window.open(mapsUrl(dest, travel), "_blank", "noopener");
  }
  function catIcon(c){
    switch(c){
      case "登山・アウトドア": return "⛰️";
      case "自宅・職場": return "🏠";
      case "履歴": return "🕘";
      case "お気に入り": return "⭐";
      default: return "📍";
    }
  }
  function recTravel(item){ return item.mode === "徒歩" ? "walking" : "driving"; }

  function card(item){
    var dest = item.query || item.name || "";
    var travel = recTravel(item);
    var a = document.createElement("a");
    a.className = "card";
    a.href = mapsUrl(dest, travel);
    a.target = "_blank"; a.rel = "noopener";
    a.innerHTML =
      '<div class="ico"></div>'
      + '<div class="body"><div class="name"></div><div class="meta"></div></div>'
      + '<div class="chev">›</div>';
    a.querySelector(".ico").textContent = catIcon(item.category);
    a.querySelector(".name").textContent = item.name || dest;
    var metaBits = [];
    if(item.mode) metaBits.push(item.mode === "徒歩" ? "🚶 徒歩" : "🚗 車");
    if(item.area) metaBits.push(item.area);
    a.querySelector(".meta").textContent = metaBits.join(" ・ ");
    return a;
  }

  function renderPage(items){
    var list = document.getElementById("list");
    items.forEach(function(it){ list.appendChild(card(it)); });
    document.getElementById("more").hidden = loaded.length >= total;
  }
  function renderEmptyIfNeeded(){
    if(total === 0){
      document.getElementById("list").innerHTML =
        '<div class="empty">保存した行き先はまだありません。<br>上の入力欄から今すぐ案内を開始するか、<br>「＋ 行き先を保存する」で登録できます。</div>';
    }
  }

  async function loadMore(){
    var page = await V.getItems({ offset: loaded.length, limit: PAGE, fields: FIELDS });
    total = page.total;
    loaded = loaded.concat(page.items);
    renderPage(page.items);
    renderEmptyIfNeeded();
  }

  // 入力欄から案内
  document.getElementById("goBtn").onclick = function(){
    openNav(document.getElementById("dest").value.trim());
  };
  document.getElementById("dest").addEventListener("keydown", function(e){
    if(e.key === "Enter") openNav(this.value.trim());
  });
  // モード切替
  document.querySelectorAll(".mode").forEach(function(el){
    el.onclick = function(){
      document.querySelectorAll(".mode").forEach(function(m){ m.classList.remove("on"); });
      el.classList.add("on");
      mode = el.dataset.mode;
    };
  });
  // もっと見る
  document.getElementById("more").onclick = function(){
    loadMore().catch(showError);
  };
  // 行き先を保存（チャットを起票）
  document.getElementById("addBtn").onclick = function(){
    var typed = document.getElementById("dest").value.trim();
    var msg = typed
      ? "「" + typed + "」をMulmoNaviの行き先に保存して。"
      : "MulmoNaviに新しい行き先を保存したいです。";
    V.startChat(msg);
  };

  function showError(err){
    document.getElementById("list").innerHTML =
      '<div class="err">読み込みに失敗しました: ' + (err && err.message || err) + '</div>';
  }
  loadMore().catch(showError);
</script>
</body>
</html>
